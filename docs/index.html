    run();
    if (typeof ResizeObserver !== "undefined") {
      var observer = new ResizeObserver(run);
      observer.observe(box);
      observers.push(observer);
      if (owner) owner._ro = observer;
    }
  }

  function historyRowsFor(historyKey, key) {
    var bucket = state.history[historyKey];
    if (!bucket || typeof bucket !== "object") return [];
    var rows = bucket[key];
    return Array.isArray(rows) ? rows : [];
  }

  function historyRows(search, stay) {
    return historyRowsFor(search.history_key, stay.key);
  }

  function buildHistorySvg(geo, series) {
    var svg = svgEl("svg", {
      class: "chart",
      viewBox: "0 0 " + geo.width + " " + geo.height,
      width: geo.width,
      height: geo.height,
      role: "img",
      tabindex: "0"
    });
    var lastPriced = null;
    series.points.forEach(function (p) { if (p.price !== null) lastPriced = p; });
    var lowest = null;
    series.points.forEach(function (p) { if (p.price !== null && (lowest === null || p.price < lowest)) lowest = p.price; });
    svg.setAttribute("aria-label", "Price history: " + series.points.length + " records, lowest " +
      formatPln(lowest) + (lastPriced ? ", latest " + formatPln(lastPriced.price) : ", none priced now"));

    geo.yTicks.forEach(function (tick) {
      svg.appendChild(svgEl("line", { class: "grid", x1: geo.plot.left, x2: geo.plot.right, y1: tick.y, y2: tick.y }));
      var label = svgEl("text", { class: "ax", x: geo.plot.left - 6, y: tick.y + 4, "text-anchor": "end" });
      label.textContent = tick.label;
      svg.appendChild(label);
    });

    geo.refLines.forEach(function (ref) {
      svg.appendChild(svgEl("line", { class: "ref-" + ref.kind, x1: geo.plot.left, x2: geo.plot.right, y1: ref.y, y2: ref.y }));
      var text = svgEl("text", {
        class: "ref-label" + (ref.kind === "alert" ? "" : " " + ref.kind),
        x: ref.anchor === "start" ? geo.plot.left + 6 : geo.plot.right,
        y: ref.labelY,
        "text-anchor": ref.anchor
      });
      text.textContent = ref.label;
      svg.appendChild(text);
    });

    var d = "";
    var open = false;
    geo.steps.forEach(function (seg) {
      if (seg.price === null) {
        open = false;
        return;
      }
      if (!open) {
        d += "M" + seg.x1.toFixed(1) + " " + seg.y.toFixed(1);
        open = true;
      } else {
        d += "V" + seg.y.toFixed(1);
      }
      d += "H" + seg.x2.toFixed(1);
    });
    if (d) svg.appendChild(svgEl("path", { class: "step", d: d }));

    geo.dots.forEach(function (dot) {
      var node = svgEl("circle", { class: dot.price === null ? "dot gone" : "dot", cx: dot.x.toFixed(1), cy: dot.y.toFixed(1), r: dot.price === null ? 3 : 3.5 });
      svg.appendChild(node);
    });

    geo.xTicks.forEach(function (tick) {
      var label = svgEl("text", { class: "ax", x: tick.x.toFixed(1), y: geo.height - 6, "text-anchor": tick.anchor });
      label.textContent = tick.label;
      svg.appendChild(label);
    });

    var cursor = svgEl("line", { class: "cursor", x1: 0, x2: 0, y1: geo.plot.top, y2: geo.plot.bottom, visibility: "hidden" });
    var hl = svgEl("circle", { class: "hl", cx: 0, cy: 0, r: 5, visibility: "hidden" });
    svg.appendChild(cursor);
    svg.appendChild(hl);

    var index = geo.dots.length - 1;

    function describe(i) {
      var dot = geo.dots[i];
      var sub = formatDayMonthTime(dot.t, series.offset) + (dot.offer ? " · " + dot.offer : "");
      return { main: dot.price === null ? "Sold out" : formatPln(dot.price), sub: sub };
    }

    function select(i, rect) {
      index = i;
      var dot = geo.dots[i];
      cursor.setAttribute("x1", dot.x.toFixed(1));
      cursor.setAttribute("x2", dot.x.toFixed(1));
      cursor.setAttribute("visibility", "visible");
      hl.setAttribute("cx", dot.x.toFixed(1));
      hl.setAttribute("cy", dot.y.toFixed(1));
      hl.setAttribute("visibility", "visible");
      var text = describe(i);
      showTip(rect, text.main, text.sub);
    }

    function nearest(clientX) {
      var box = svg.getBoundingClientRect();
      var px = (clientX - box.left) * (geo.width / box.width);
      var best = 0;
      geo.dots.forEach(function (dot, i) {
        if (Math.abs(dot.x - px) < Math.abs(geo.dots[best].x - px)) best = i;
      });
      return best;
    }

    function clear() {
      cursor.setAttribute("visibility", "hidden");
      hl.setAttribute("visibility", "hidden");
      hideTip();
    }

    svg.addEventListener("pointermove", function (event) {
      if (event.pointerType && event.pointerType !== "mouse") return;
      var i = nearest(event.clientX);
      select(i, { left: event.clientX, right: event.clientX, top: event.clientY - 6, bottom: event.clientY + 6 });
    });
    svg.addEventListener("pointerleave", clear);
    svg.addEventListener("focus", function () {
      var box = svg.getBoundingClientRect();
      var dot = geo.dots[index];
      var x = box.left + dot.x * (box.width / geo.width);
      var y = box.top + dot.y * (box.height / geo.height);
      select(index, { left: x, right: x, top: y - 6, bottom: y + 6 });
    });
    svg.addEventListener("blur", clear);
    svg.addEventListener("keydown", function (event) {
      var next = null;
      if (event.key === "ArrowLeft") next = Math.max(0, index - 1);
      else if (event.key === "ArrowRight") next = Math.min(geo.dots.length - 1, index + 1);
      else if (event.key === "Home") next = 0;
      else if (event.key === "End") next = geo.dots.length - 1;
      else if (event.key === "Escape") { clear(); return; }
      if (next === null) return;
      event.preventDefault();
      var box = svg.getBoundingClientRect();
      var dot = geo.dots[next];
      var x = box.left + dot.x * (box.width / geo.width);
      var y = box.top + dot.y * (box.height / geo.height);
      select(next, { left: x, right: x, top: y - 6, bottom: y + 6 });
    });
    return svg;
  }

  function drawHistory(box, series, refs, width) {
    box.textContent = "";
    var geo = chartGeometry(series, {
      width: width,
      height: width < 480 ? 184 : 212,
      refs: refs
    });
    if (!geo) {
      box.appendChild(el("p", { class: "cell-note", text: "No prices recorded" }));
      return;
    }
    box.appendChild(buildHistorySvg(geo, series));
  }

  /* Reference lines for a stay in the stays table: the search's threshold and the hotel's 30-day low. */
  function refsForStay(search, stay) {
    var refs = [];
    var th = thresholdOf(search);
    if (th) refs.push({ kind: "alert", value: th.total });
    if (isNumber(stay.recent_lowest)) refs.push({ kind: "low", value: stay.recent_lowest });
    return refs;
  }

  function buildDetail(search, stay, key) {
    var detail = el("div", { class: "tr-detail", role: "row", "data-detail": key });
    var box = el("div", { class: "chart-box", role: "cell" });
    detail.appendChild(box);
    var series = historySeries(historyRows(search, stay), state.latest.scanned_at);
    var refs = refsForStay(search, stay);
    attachChart(box, function (width) {
      drawHistory(box, series, refs, width);
    }, detail);
    return detail;
  }

  /* Price history for a tracked trip, with the alert, the first price and the lowest price seen as reference lines. */
  function tripDetail(cfg, live) {
    var wrap = el("div", { class: "trip-chart", "data-detail": "trip|" + cfg.id });
    var box = el("div", { class: "chart-box", role: "img", "aria-label": "Price history for this trip" });
    wrap.appendChild(box);
    var series = historySeries(historyRowsFor(live.history_key, live.key), state.latest.scanned_at);
    var refs = [];
    if (isNumber(cfg.below)) refs.push({ kind: "alert", value: cfg.below * 100 });
    if (isNumber(live.first_price)) refs.push({ kind: "first", value: live.first_price });
    if (isNumber(live.lowest_seen)) refs.push({ kind: "lowest", value: live.lowest_seen });
    attachChart(box, function (width) {
      drawHistory(box, series, refs, width);
    }, wrap);
    return wrap;
  }

  function findDetail(key) {
    var nodes = document.querySelectorAll("[data-detail]");
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-detail") === key) return nodes[i];
    }
    return null;
  }

  function setPressed(key, pressed) {
    var cells = document.querySelectorAll("[data-heat]");
    for (var i = 0; i < cells.length; i++) {
      if (cells[i].getAttribute("data-heat") === key) cells[i].setAttribute("aria-pressed", pressed ? "true" : "false");
    }
  }

  function toggleRow(search, stay, row) {
    var key = search.id + "|" + stay.key;
    var wasOpen = !!state.open[key];
    var button = row.querySelector(".stay-btn");
    if (wasOpen) {
      delete state.open[key];
      row.classList.remove("open");
      button.setAttribute("aria-expanded", "false");
      var old = findDetail(key);
      if (old) {
        if (old._ro) old._ro.disconnect();
        old.remove();
      }
    } else {
      state.open[key] = true;
      row.classList.add("open");
      button.setAttribute("aria-expanded", "true");
      row.insertAdjacentElement("afterend", buildDetail(search, stay, key));
    }
    setPressed(key, !wasOpen);
  }

  function heatClick(search, stay) {
    var key = search.id + "|" + stay.key;
    var row = findByAttr("data-row", key);
    if (row) {
      toggleRow(search, stay, row);
      row.scrollIntoView({ block: "nearest" });
      return;
    }
    state.showAll[search.id] = true;
    state.open[key] = true;
    renderApp();
  }

  function copyDates(button, stay, adults) {
    var text = copyText(stay, adults);
    function done(label) {
      button.textContent = label;
      copyTimers.push(window.setTimeout(function () { button.textContent = "Copy dates"; }, 1600));
    }
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        done("Copy failed");
        return;
      }
      navigator.clipboard.writeText(text).then(function () { done("Copied"); }, function () { done("Copy failed"); });
    } catch (e) {
      done("Copy failed");
    }
  }

  function copyButton(stay, adults) {
    var copy = el("button", { type: "button", class: "btn copy", text: "Copy dates" });
    copy.addEventListener("click", function (event) {
      event.stopPropagation();
      copyDates(copy, stay, adults);
    });
    return copy;
  }

  function flagChips(flags) {
    var wrap = el("div", { class: "chips" });
    flags.forEach(function (flag) {
      wrap.appendChild(el("span", { class: "chip " + flag.kind, text: flag.label, "data-tip": flag.tip }));
    });
    return wrap;
  }

  function starIcon() {
    var svg = svgEl("svg", { viewBox: "0 0 24 24", width: 16, height: 16, fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linejoin": "round", "aria-hidden": "true" });
    svg.appendChild(svgEl("path", { d: "M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.6l-5 2.6.9-5.6-4-3.9 5.6-.8z" }));
    return svg;
  }

  function svgIcon() {
    var svg = svgEl("svg", { viewBox: "0 0 12 12", width: 10, height: 10, fill: "none", stroke: "currentColor", "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
    svg.appendChild(svgEl("path", { d: "M4 2.5 8 6 4 9.5" }));
    return svg;
  }

  /* Track toggle on a stay row. Uses the config's adults and codes, so the id matches what the scanner writes. */
  function trackButton(search, stay) {
    var current = findById(state.config.searches, search.id) || search;
    var on = isTrackedStay(state.config, current, stay);
    var label = formatStay(stay.check_in, stay.check_out);
    var button = el("button", {
      type: "button",
      class: "icon-btn track",
      "aria-pressed": on ? "true" : "false",
      "aria-label": (on ? "Stop tracking " : "Track ") + label,
      "data-tip": !isConnected() ? CONNECT_HINT : on ? "Tracked: tap to stop" : "Track this stay",
      "data-focus": "track|" + search.id + "|" + stay.key
    });
    button.appendChild(starIcon());
    button.addEventListener("click", function (event) {
      event.stopPropagation();
      if (!requireConnected()) return;
      var fresh = findById(state.config.searches, search.id);
      if (!fresh) return;
      if (on) {
        runEdit("tracked", function (c) { return removeTracked(c, trackedId(stay.check_in, stay.check_out, fresh.adults, fresh.codes)); }, "Stop tracking");
      } else {
        var entry = trackedEntry(fresh, stay, todayIso(nowMs()));
        runEdit("tracked", function (c) { return insertTracked(c, entry); }, "Track stay");
      }
    });
    return button;
  }

  function stayRow(search, stay) {
    var key = search.id + "|" + stay.key;
    var priced = isPriced(stay);
    var isOpen = !!state.open[key];
    var row = el("div", {
      class: "tr" + (priced ? "" : " sold") + (isOpen ? " open" : ""),
      role: "row",
      "data-row": key
    });
    var button = el("button", {
      type: "button",
      class: "stay-btn",
      "aria-expanded": isOpen ? "true" : "false",
      "aria-label": formatStay(stay.check_in, stay.check_out) + (priced ? "" : ", sold out"),
      "data-focus": "stay|" + key
    });
    button.appendChild(document.createTextNode(formatStay(stay.check_in, stay.check_out)));
    button.appendChild(svgIcon());

    var total;
    if (priced) {
      var kids = [];
      if (isNumber(stay.original) && stay.original > stay.price) {
        kids.push(el("span", { class: "was", text: formatPln(stay.original) }));
      }
      kids.push(el("span", { class: "price", text: formatPln(stay.price) }));
      total = el("div", { class: "num c-total", role: "cell" }, kids);
    } else {
      total = el("div", { class: "num c-total", role: "cell", text: "Sold out" });
    }

    var night = priced
      ? el("div", { class: "num c-night", role: "cell" }, [
          el("span", { text: formatPln(stay.per_night) }),
          el("span", { class: "unit", text: " a night" })
        ])
      : el("div", { class: "c-night num", role: "cell", text: DASH });

    var action = el("div", { class: "c-act", role: "cell" });
    action.appendChild(trackButton(search, stay));
    if (priced) {
      var url = bookUrl(state.slug, stay, search.adults);
      if (url) {
        action.appendChild(el("a", {
          class: "btn primary",
          href: url,
          target: "_blank",
          rel: "noopener noreferrer",
          text: "Book",
          "aria-label": "Book " + formatStay(stay.check_in, stay.check_out) + " on the booking site"
        }));
      } else {
        action.appendChild(copyButton(stay, search.adults));
      }
    }

    row.appendChild(el("div", { class: "c-stay", role: "cell" }, [button]));
    row.appendChild(total);
    row.appendChild(night);
    row.appendChild(el("div", { class: "c-flags", role: "cell" }, [priced ? chipsFor(stay) : null]));
    row.appendChild(action);

    row.addEventListener("click", function (event) {
      if (event.target.closest && event.target.closest("a, button.copy, button.track")) return;
      toggleRow(search, stay, row);
    });
    return row;
  }

  function chipsFor(stay) {
    return flagChips(stayFlags(stay));
  }

  function staysCard(search, summary) {
    var all = orderStays(search.stays);
    var shown = state.showAll[search.id] ? all : defaultRows(search);
    var card = el("section", { class: "card stays" });
    card.appendChild(el("div", { class: "card-head" }, [el("h3", { text: "Stays" })]));
    var table = el("div", { class: "tbl", role: "table", "aria-label": "Stays for " + search.name });
    table.appendChild(el("div", { class: "tr head", role: "row" }, [
      el("div", { role: "columnheader", text: "Stay" }),
      el("div", { class: "num", role: "columnheader", text: "Total" }),
      el("div", { class: "num c-night", role: "columnheader", text: "A night" }),
      el("div", { role: "columnheader", text: "Flags" }),
      el("div", { role: "columnheader", class: "sr-only", text: "Action" })
    ]));
    var body = el("div", { role: "rowgroup" });
    if (!all.length) {
      body.appendChild(el("div", { class: "tr empty-row", role: "row" }, [
        el("div", { class: "cell-note", role: "cell", text: "No stays in this window" })
      ]));
    }
    shown.forEach(function (stay) {
      var key = search.id + "|" + stay.key;
      body.appendChild(stayRow(search, stay));
      if (state.open[key]) body.appendChild(buildDetail(search, stay, key));
    });
    table.appendChild(body);
    card.appendChild(table);

    var hidden = all.length - shown.length;
    if (state.showAll[search.id] && search.top !== null && search.top !== undefined && summary.priced > 0) {
      card.appendChild(footer("Show top " + search.top, "showall|" + search.id, search.id));
    } else if (hidden > 0) {
      card.appendChild(footer("Show all " + all.length, "showall|" + search.id, search.id));
    }
    return card;
  }

  function footer(label, focusKey, searchId) {
    var bar = el("div", { class: "tfoot" });
    var button = el("button", { type: "button", class: "link", text: label, "data-focus": focusKey });
    button.addEventListener("click", function () {
      state.showAll[searchId] = !state.showAll[searchId];
      renderApp();
    });
    bar.appendChild(button);
    return bar;
  }

  function heatCard(search, ref) {
    var card = el("section", { class: "card heat" });
    card.appendChild(el("div", { class: "card-head" }, [el("h3", { text: "By check-in" })]));
    var th = thresholdOf(search);
    var nearText = th ? "Within 10% above the alert" : "Within 10% above the cheapest";
    var midText = th ? "10 to 25% above the alert" : "10 to 25% above the cheapest";
    var farText = th ? "More than 25% above the alert" : "More than 25% above the cheapest";
    card.appendChild(el("div", { class: "legend" }, [
      el("span", { "data-tip": "Priced below the alert threshold" }, [el("i", { class: "cell under", "aria-hidden": "true" }), "Under alert"]),
      el("span", { "data-tip": nearText }, [el("i", { class: "cell near", "aria-hidden": "true" }), "Near"]),
      el("span", { "data-tip": midText }, [el("i", { class: "cell mid", "aria-hidden": "true" }), "Mid"]),
      el("span", { "data-tip": farText }, [el("i", { class: "cell far", "aria-hidden": "true" }), "Far"]),
      el("span", { "data-tip": "No price for these dates" }, [el("i", { class: "cell sold", "aria-hidden": "true" }), "Sold out"])
    ]));
    var layout = calendarLayout(search.stays, ref);
    var grid = el("div", { class: "cal", role: "group", "aria-label": "Prices by check-in for " + search.name });
    grid.style.setProperty("--cols", String(Math.max(layout.cols, 1)));
    grid.style.setProperty("--rows", String(Math.max(layout.weekdays.length, 1)));
    layout.months.forEach(function (m) {
      var node = el("div", { class: "mon", text: m.label, "aria-hidden": "true" });
      node.style.gridColumn = String(m.col + 2);
      node.style.gridRow = "1";
      grid.appendChild(node);
    });
    layout.weekdays.forEach(function (day, lane) {
      var node = el("div", { class: "wd", text: WEEKDAY_LETTER[day], "aria-hidden": "true", "data-tip": WEEKDAY_NAME[day] });
      node.style.gridColumn = "1";
      node.style.gridRow = String(lane + 2);
      grid.appendChild(node);
    });
    layout.cells.forEach(function (c) {
      var key = search.id + "|" + c.stay.key;
      var label = (isPriced(c.stay) ? formatPln(c.stay.price) : "Sold out") + " · " + formatStay(c.stay.check_in, c.stay.check_out);
      var cell = el("button", {
        type: "button",
        class: "cell " + c.tier,
        "aria-label": label,
        "aria-pressed": state.open[key] ? "true" : "false",
        "data-heat": key,
        "data-focus": "heat|" + key,
        "data-tip": label
      }, [
        el("span", { class: "d", text: String(c.day) }),
        isPriced(c.stay) ? el("span", { class: "p", text: formatCompactPln(c.stay.price) }) : null
      ]);
      cell.style.gridColumn = String(c.col + 2);
      cell.style.gridRow = String(c.lane + 2);
      cell.addEventListener("click", function () { heatClick(search, c.stay); });
      grid.appendChild(cell);
    });
    card.appendChild(el("div", { class: "cal-wrap" }, [grid]));
    return card;
  }

  function kpi(label, value, sub, tip, extraClass) {
    var classes = "kpi-value" + (extraClass ? " " + extraClass : "") + (value === DASH ? " none" : "");
    return el("div", { class: "kpi", "data-tip": tip }, [
      el("div", { class: "kpi-label", text: label }),
      el("div", { class: classes, text: value }),
      el("div", { class: "kpi-sub", text: sub || " " })
    ]);
  }

  function kpiRow(search, summary) {
    var c = summary.cheapest;
    var th = summary.threshold;
    var thText = th ? (th.kind === "per_night" ? formatPln(th.amount) + " a night" : formatPln(th.amount)) : "no alert set";
    var underValue = th && summary.priced > 0 ? String(summary.underCount) : DASH;
    var underSub = !th ? "no alert set" : summary.priced > 0 ? "of " + summary.priced + " priced" : "no prices";
    var alertValue = th && c ? formatSignedPct(summary.vsAlertPct) : DASH;
    var alertGood = th && c && roundHalfUp(summary.vsAlertPct) < 0;
    var lowValue = c && summary.vsLowPct !== null ? formatSignedPct(summary.vsLowPct) : DASH;
    var lowGood = c && summary.vsLowPct !== null && roundHalfUp(summary.vsLowPct) < 0;
    var cheapSub = c ? formatStay(c.check_in, c.check_out) : (summary.total ? "All sold out" : "No stays");
    return el("div", { class: "kpis" }, [
      kpi("Cheapest", c ? formatPln(c.price) : DASH, cheapSub, "Cheapest priced stay in this search, total for the whole stay"),
      kpi("Per night", c ? formatPln(summary.perNight) : DASH, c ? nightsText(search.nights) : "", "Cheapest stay's price per night"),
      kpi("Under alert", underValue, underSub, "Priced stays under the alert threshold"),
      kpi("vs alert", alertValue, th ? thText : "no alert set", "Cheapest stay against the alert threshold", alertGood ? "good" : ""),
      kpi("vs 30-day low", lowValue, summary.lowest !== null ? formatPln(summary.lowest) : "no 30-day low", "Cheapest stay against the hotel's lowest price of the last 30 days", lowGood ? "good" : "")
    ]);
  }

  /* Trip cards -------------------------------------------------------------------------------------------- */

  function tripMeta(cfg) {
    var parts = [];
    var n = nightsBetween(cfg.check_in, cfg.check_out);
    if (n !== null) parts.push(nightsText(n));
    if (isNumber(cfg.adults)) parts.push(adultsText(cfg.adults));
    return parts.join(" · ");
  }

  function fact(label, value, sub, tone, tip) {
    return el("div", { class: "fact", "data-tip": tip }, [
      el("dt", { text: label }),
      el("dd", { class: tone === "good" ? "good" : tone === "bad" ? "bad" : "" }, [
        el("span", { class: "v", text: value }),
        sub ? el("span", { class: "s", text: sub }) : null
      ])
    ]);
  }

  function trackRows() {
    var live = state.latest && Array.isArray(state.latest.tracked) ? state.latest.tracked : [];
    return state.config.tracked.map(function (cfg) {
      return { cfg: cfg, live: findById(live, cfg.id) };
    });
  }

  function tripCard(row) {
    var cfg = row.cfg;
    var live = row.live;
    var today = todayIso(nowMs());
    var title = formatStay(cfg.check_in, cfg.check_out);
    var open = !!live && !!state.openTrip[cfg.id];
    var sold = !!live && live.sold_out === true;
    var passed = typeof cfg.check_in === "string" && cfg.check_in < today;
    var connected = isConnected();
    var card = el("article", { class: "trip" + (sold ? " sold" : ""), "data-trip": cfg.id });

    var head;
    if (live) {
      head = el("button", {
        type: "button",
        class: "stay-btn trip-title",
        "aria-expanded": open ? "true" : "false",
        "aria-label": "Price history, " + title,
        "data-focus": "trip|" + cfg.id
      }, [document.createTextNode(title), svgIcon()]);
      head.addEventListener("click", function () {
        if (state.openTrip[cfg.id]) delete state.openTrip[cfg.id];
        else state.openTrip[cfg.id] = true;
        renderApp();
      });
    } else {
      head = el("span", { class: "trip-title-text", text: title });
    }
    card.appendChild(el("div", { class: "trip-head" }, [head, el("span", { class: "trip-nights", text: tripMeta(cfg) })]));

    if (live) {
      card.appendChild(el("div", { class: "trip-price" + (sold ? " none" : ""), text: sold ? "Sold out" : formatPln(live.price) }));
      if (!sold) card.appendChild(el("div", { class: "trip-sub", text: formatPln(live.per_night) + " a night" }));
      var delta = trackedChange(live);
      card.appendChild(el("dl", { class: "facts" }, [
        fact("Since tracked", delta ? formatSignedPln(delta.change) : DASH, delta ? formatSignedPct(delta.pct) : "",
          delta ? delta.tone : "none", "Price now minus the price at the first scan after tracking"),
        fact("Lowest seen", formatPln(live.lowest_seen), "", "none", "Lowest price recorded for this stay since it was tracked")
      ]));
      var parts = [live.room_name, live.meal_plan, live.offer_name, live.cancel].filter(function (p) { return typeof p === "string" && p; });
      if (parts.length) card.appendChild(el("p", { class: "trip-detail", text: parts.join(" · ") }));
      if (!sold) {
        var flags = tripFlags(live);
        if (flags.length) card.appendChild(flagChips(flags));
      }
      if (open) card.appendChild(tripDetail(cfg, live));
    } else {
      card.appendChild(el("p", { class: "trip-note", text: passed ? "Check-in passed" : "Scanning…" }));
    }

    var seg = el("div", { class: "seg mini", role: "group", "aria-label": "Notify me about " + title });
    NOTIFY_MODES.forEach(function (mode) {
      var button = el("button", {
        type: "button",
        "aria-pressed": cfg.notify === mode ? "true" : "false",
        text: NOTIFY_LABEL[mode],
        "data-focus": "notify|" + cfg.id + "|" + mode
      });
      button.addEventListener("click", guard(function () {
        if (cfg.notify !== mode) {
          runEdit("tracked", function (c) { return setTrackedNotify(c, cfg.id, mode); }, "Notify " + mode);
        }
      }));
      seg.appendChild(button);
    });

    var belowInput = el("input", {
      type: "number",
      name: "below-" + cfg.id,
      inputmode: "numeric",
      min: "1",
      step: "1",
      max: String(MAX_PLN),
      placeholder: DASH,
      "aria-label": "Alert below, zł, for " + title,
      "data-focus": "below|" + cfg.id
    });
    belowInput.value = isNumber(cfg.below) ? String(cfg.below) : "";
    if (!connected) {
      belowInput.readOnly = true;
      belowInput.addEventListener("click", function () { requireConnected(); });
    }
    belowInput.addEventListener("change", function () {
      if (!requireConnected()) {
        belowInput.value = isNumber(cfg.below) ? String(cfg.below) : "";
        return;
      }
      var raw = belowInput.value.trim();
      var value = raw === "" ? null : parseWhole(raw, 1, MAX_PLN);
      if (raw !== "" && value === null) {
        state.notice = { kind: "error", text: "Alert below takes whole złoty above 0." };
        renderApp();
        return;
      }
      if (value === (isNumber(cfg.below) ? cfg.below : null)) return;
      runEdit("tracked", function (c) { return setTrackedBelow(c, cfg.id, value); }, "Alert below");
    });

    var belowLabel = el("label", { class: "below" }, [
      el("span", { text: "Alert below" }),
      el("span", { class: "suffix-field" }, [belowInput, el("span", { class: "suffix", text: "zł" })])
    ]);
    card.appendChild(el("div", { class: "trip-controls" }, [seg, belowLabel]));

    var foot = el("div", { class: "trip-foot" });
    if (live && isPriced(live)) {
      var url = bookUrl(state.slug, live, cfg.adults);
      if (url) {
        foot.appendChild(el("a", {
          class: "btn primary",
          href: url,
          target: "_blank",
          rel: "noopener noreferrer",
          text: "Book",
          "aria-label": "Book " + title + " on the booking site"
        }));
      } else {
        foot.appendChild(copyButton(live, cfg.adults));
      }
    }
    var untrack = el("button", { type: "button", class: "btn", text: "Untrack", "data-focus": "untrack|" + cfg.id });
    untrack.addEventListener("click", guard(function () {
      runEdit("tracked", function (c) { return removeTracked(c, cfg.id); }, "Untrack");
    }));
    foot.appendChild(untrack);
    card.appendChild(foot);
    return card;
  }

  function trackedSection() {
    var section = el("section", { class: "tracked", "aria-labelledby": "trackedHead" });
    var head = el("div", { class: "sec-head" }, [el("h2", { id: "trackedHead", text: "Tracked trips" })]);
    if (!isConnected()) {
      var connect = el("button", { type: "button", class: "link", text: CONNECT_HINT, "data-focus": "connect|tracked" });
      connect.addEventListener("click", function () { requireConnected(); });
      head.appendChild(connect);
    }
    section.appendChild(head);
    var status = pendingLine("tracked");
    if (status) section.appendChild(status);
    var rows = trackRows();
    if (!rows.length) {
      section.appendChild(el("p", { class: "empty-line", text: "Star a stay below to track its price." }));
      return section;
    }
    var grid = el("div", { class: "trips" });
    rows.forEach(function (row) { grid.appendChild(tripCard(row)); });
    section.appendChild(grid);
    return section;
  }

  /* Search panels ------------------------------------------------------------------------------------------ */

  function searchMeta(cfg) {
    var meta = el("div", { class: "meta" });
    meta.appendChild(el("span", { text: nightsText(isNumber(cfg.nights) ? cfg.nights : 2) }));
    meta.appendChild(el("span", { text: adultsText(isNumber(cfg.adults) ? cfg.adults : 2) }));
    meta.appendChild(el("span", { text: formatWindow(cfg.from, cfg.to) }));
    if (Array.isArray(cfg.must_include) && cfg.must_include.length) {
      var days = cfg.must_include.map(function (d) {
        var key = String(d).toLowerCase();
        return key.charAt(0).toUpperCase() + key.slice(1);
      });
      meta.appendChild(el("span", { text: "Covers " + days.join(", ") }));
    }
    if (Array.isArray(cfg.codes) && cfg.codes.length) {
      meta.appendChild(el("span", { text: "Code " + cfg.codes.join(", ") }));
    }
    return meta;
  }

  function pendingText(p) {
    if (p.gaveUp) return "Still waiting for the scan.";
    if (p.sample) return "Saved in sample mode. Nothing was sent to GitHub.";
    return "Saved, scanning… results in about 2 min";
  }

  function pendingLine(scope) {
    var p = state.pending;
    if (!p || p.scope !== scope) return null;
    return el("p", { class: "pending", role: "status", text: pendingText(p) });
  }

  function scanCard() {
    return el("section", { class: "card scan" }, [
      el("p", { class: "scan-line", text: state.error ? "Results unavailable right now." : "Scanning…" }),
      state.error ? null : el("div", { class: "skel scan-skel", "aria-hidden": "true" })
    ]);
  }

  function capitalDay(tok) {
    return tok.charAt(0).toUpperCase() + tok.slice(1);
  }

  function nextAlertKind(draft) {
    var used = draft.alerts.map(function (row) { return row.kind; });
    for (var i = 0; i < ALERT_KINDS.length; i++) {
      if (used.indexOf(ALERT_KINDS[i]) < 0) return ALERT_KINDS[i];
    }
    return "below";
  }

  function setErr(node, message) {
    node.textContent = message || "";
  }

  /* The inline editor. Typing updates the draft and the checks in place; structural changes re-render the app. */
  function editorPanel(cfg) {
    var d = state.draft;
    var today = todayIso(nowMs());
    var form = el("form", { class: "editor", novalidate: "", "aria-label": "Edit search" });
    var preview = el("p", { class: "preview", "aria-live": "polite" });
    var alertErrs = [];
    var fromErr = el("p", { class: "field-err", id: "edFromErr" });
    var toErr = el("p", { class: "field-err", id: "edToErr" });
    var topErr = el("p", { class: "field-err", id: "edTopErr" });
    var saveBtn = el("button", { type: "submit", class: "btn primary", text: "Save", "data-focus": "ed|save", disabled: state.busy });
    var fromInput;
    var toInput;
    var nameInput;

    function refresh() {
      var now = todayIso(nowMs());
      var check = checkDraft(d, now);
      setErr(fromErr, check.errors.from);
      setErr(toErr, check.errors.to);
      setErr(topErr, check.errors.top);
      fromInput.setAttribute("aria-invalid", check.errors.from ? "true" : "false");
      toInput.setAttribute("aria-invalid", check.errors.to ? "true" : "false");
      alertErrs.forEach(function (node, i) { setErr(node, check.alerts[i]); });
      nameInput.placeholder = derivedName(d.from, d.to, scanYear()) || "From the dates";
      if (check.errors.from || check.errors.to) {
        preview.textContent = "";
      } else {
        preview.textContent = countLabel(staysToCheck(d.from, d.to, d.nights, d.mustInclude, now));
      }
      saveBtn.disabled = !check.valid || state.busy;
    }

    nameInput = el("input", {
      type: "text",
      name: "name",
      maxlength: "60",
      autocomplete: "off",
      spellcheck: "false",
      "data-focus": "ed|name",
      "aria-label": "Name"
    });
    nameInput.value = d.name;
    nameInput.addEventListener("input", function () { d.name = nameInput.value; });

    function dateInput(key, label, errNode) {
      var input = el("input", { type: "date", name: key, min: today, "data-focus": "ed|" + key, "aria-label": label });
      input.value = d[key];
      function changed() {
        d[key] = input.value;
        refresh();
      }
      input.addEventListener("input", changed);
      input.addEventListener("change", changed);
      return input;
    }
    fromInput = dateInput("from", "From", fromErr);
    toInput = dateInput("to", "To", toErr);

    function stepper(label, key, min, max) {
      var output = el("output", { "aria-label": label, text: String(d[key]) });
      var fewer = el("button", { type: "button", class: "step-btn", "aria-label": "Fewer " + label.toLowerCase(), text: "−", "data-focus": "ed|" + key + "|-" });
      var more = el("button", { type: "button", class: "step-btn", "aria-label": "More " + label.toLowerCase(), text: "+", "data-focus": "ed|" + key + "|+" });
      function sync() {
        output.textContent = String(d[key]);
        fewer.disabled = d[key] <= min;
        more.disabled = d[key] >= max;
      }
      fewer.addEventListener("click", function () {
        if (d[key] > min) { d[key] -= 1; sync(); refresh(); }
      });
      more.addEventListener("click", function () {
        if (d[key] < max) { d[key] += 1; sync(); refresh(); }
      });
      fewer.disabled = d[key] <= min;
      more.disabled = d[key] >= max;
      return el("div", { class: "field" }, [
        el("span", { class: "field-label", text: label }),
        el("div", { class: "step-row" }, [fewer, output, more])
      ]);
    }

    var days = el("div", { class: "days", role: "group", "aria-label": "Required nights" });
    DAY_TOKENS.forEach(function (tok, i) {
      var button = el("button", {
        type: "button",
        "aria-pressed": d.mustInclude.indexOf(tok) >= 0 ? "true" : "false",
        "aria-label": WEEKDAY_NAME[i],
        text: DAY_SHORT[i],
        "data-focus": "ed|day|" + tok
      });
      button.addEventListener("click", function () {
        var list = d.mustInclude.slice();
        var at = list.indexOf(tok);
        if (at >= 0) list.splice(at, 1);
        else list.push(tok);
        d.mustInclude = orderDays(list);
        button.setAttribute("aria-pressed", d.mustInclude.indexOf(tok) >= 0 ? "true" : "false");
        refresh();
      });
      days.appendChild(button);
    });

    var topWrap = el("div", { class: "field" });
    var topSeg = el("div", { class: "seg mini", role: "group", "aria-label": "Stays to list" });
    var topAll = el("button", { type: "button", "aria-pressed": d.topAll ? "true" : "false", text: "All", "data-focus": "ed|top|all" });
    var topCount = el("button", { type: "button", "aria-pressed": d.topAll ? "false" : "true", text: "Top", "data-focus": "ed|top|count" });
    topAll.addEventListener("click", function () { d.topAll = true; renderApp(); });
    topCount.addEventListener("click", function () { d.topAll = false; renderApp(); });
    topSeg.appendChild(topAll);
    topSeg.appendChild(topCount);
    topWrap.appendChild(el("span", { class: "field-label", text: "Stays to list" }));
    topWrap.appendChild(topSeg);
    if (!d.topAll) {
      var topInput = el("input", { type: "number", name: "top", inputmode: "numeric", min: "1", step: "1", max: String(MAX_TOP), "aria-label": "Stays to list, number", "data-focus": "ed|top|value" });
      topInput.value = d.top;
      topInput.addEventListener("input", function () { d.top = topInput.value; refresh(); });
      topWrap.appendChild(topInput);
    }
    topWrap.appendChild(topErr);

    var alertsBox = el("div", { class: "alerts" });
    d.alerts.forEach(function (row, index) {
      var select = el("select", { name: "kind-" + index, "aria-label": "Alert " + (index + 1) + " kind", "data-focus": "ed|kind|" + index });
      ALERT_KINDS.forEach(function (kind) {
        var opt = el("option", { value: kind, text: ALERT_LABEL[kind] });
        if (kind === row.kind) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", function () {
        row.kind = select.value;
        row.value = "";
        renderApp();
      });
      var line = el("div", { class: "alert-row" }, [select]);
      if (kindHasValue(row.kind)) {
        var isPercent = row.kind === "drop_pct";
        var valueInput = el("input", {
          type: "number",
          name: "value-" + index,
          inputmode: "numeric",
          min: "1",
          step: "1",
          max: isPercent ? "100" : String(MAX_PLN),
          placeholder: isPercent ? "%" : "zł",
          "aria-label": (isPercent ? "Percent" : "Złoty") + " for alert " + (index + 1),
          "data-focus": "ed|val|" + index
        });
        valueInput.value = row.value;
        valueInput.addEventListener("input", function () { row.value = valueInput.value; refresh(); });
        line.appendChild(el("span", { class: "val" }, [valueInput, el("span", { class: "suffix", text: isPercent ? "%" : "zł" })]));
      } else {
        line.appendChild(el("span"));
      }
      var remove = el("button", { type: "button", class: "icon-btn-s", "aria-label": "Remove alert " + (index + 1), text: "×", "data-focus": "ed|rm|" + index });
      remove.addEventListener("click", function () {
        d.alerts.splice(index, 1);
        renderApp();
      });
      line.appendChild(remove);
      var err = el("p", { class: "field-err" });
      alertErrs.push(err);
      alertsBox.appendChild(el("div", { class: "alert-item" }, [line, err]));
    });
    var addAlert = el("button", { type: "button", class: "link", text: "Add alert", "data-focus": "ed|add" });
    addAlert.addEventListener("click", function () {
      d.alerts.push({ kind: nextAlertKind(d), value: "" });
      renderApp();
    });

    var cancel = el("button", { type: "button", class: "btn", text: "Cancel", "data-focus": "ed|cancel" });
    cancel.addEventListener("click", function () { closeEditor(); });
    var actions;
    if (state.confirmDelete === cfg.id) {
      var confirmDelete = el("button", { type: "button", class: "btn danger", text: "Delete", "data-focus": "ed|delete-yes" });
      confirmDelete.addEventListener("click", function () {
        runEdit("config", function (c) { return removeSearch(c, cfg.id); }, "Delete search", function () {
          state.editing = null;
          state.draft = null;
          state.confirmDelete = null;
        });
      });
      var keep = el("button", { type: "button", class: "btn", text: "Keep", "data-focus": "ed|keep" });
      keep.addEventListener("click", function () {
        state.confirmDelete = null;
        renderApp();
      });
      actions = el("div", { class: "ed-actions" }, [
        el("div", { class: "confirm", role: "group", "aria-label": "Confirm delete" }, [el("span", { text: "Delete this search?" }), confirmDelete, keep]),
        el("span", { class: "spacer" }),
        cancel,
        saveBtn
      ]);
    } else {
      var deleteBtn = el("button", { type: "button", class: "btn danger", text: "Delete search", "data-focus": "ed|delete" });
      deleteBtn.addEventListener("click", function () {
        state.confirmDelete = cfg.id;
        renderApp();
      });
      actions = el("div", { class: "ed-actions" }, [deleteBtn, el("span", { class: "spacer" }), cancel, saveBtn]);
    }

    form.appendChild(el("div", { class: "ed-grid" }, [
      el("div", { class: "field f-wide" }, [el("span", { class: "field-label", text: "Name" }), nameInput]),
      el("div", { class: "field" }, [el("span", { class: "field-label", text: "From" }), fromInput, fromErr]),
      el("div", { class: "field" }, [el("span", { class: "field-label", text: "To" }), toInput, toErr]),
      stepper("Nights", "nights", 1, 14),
      stepper("Adults", "adults", 1, 6),
      topWrap
    ]));
    form.appendChild(el("div", { class: "field" }, [
      el("span", { class: "field-label", text: "Required nights" }),
      days,
      el("p", { class: "field-hint", text: "None selected: any check-in" })
    ]));
    form.appendChild(el("div", { class: "field" }, [
      el("span", { class: "field-label", text: "Alerts" }),
      alertsBox,
      el("div", {}, [addAlert])
    ]));
    form.appendChild(preview);
    form.appendChild(actions);

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      saveEditor();
    });
    refresh();
    return form;
  }

  function openEditor(id) {
    var search = findById(state.config.searches, id);
    if (!search) return;
    state.editing = id;
    state.draft = draftFromSearch(search, state.config.defaults);
    state.confirmDelete = null;
    renderApp();
    var first = findByAttr("data-focus", "ed|name");
    if (first) first.focus();
  }

  function closeEditor() {
    state.editing = null;
    state.draft = null;
    state.confirmDelete = null;
    renderApp();
  }

  function saveEditor() {
    var d = state.draft;
    var id = state.editing;
    if (!d || !id) return;
    var check = checkDraft(d, todayIso(nowMs()));
    if (!check.valid) {
      renderApp();
      return;
    }
    var snapshot = clone(d);
    runEdit("search|" + id, function (c) {
      var base = findById(c.searches, id);
      if (!base) return c;
      return replaceSearch(c, searchFromDraft(snapshot, id, base));
    }, "Edit search", function () {
      state.editing = null;
      state.draft = null;
      state.confirmDelete = null;
    });
  }

  function addSearchFlow() {
    if (!requireConnected()) return;
    var id = newSearchId(nowMs());
    var today = todayIso(nowMs());
    runEdit("search|" + id, function (c) {
      return insertSearch(c, defaultSearch(c, id, today));
    }, "Add search", function () {
      openEditor(id);
    });
  }

  function searchPanel(row) {
    var cfg = row.cfg;
    var live = row.live;
    var name = displayName(cfg, live, scanYear());
    var editing = state.editing === cfg.id;
    var section = el("section", { class: "search", "aria-label": name, "data-search": cfg.id });
    var editButton = el("button", {
      type: "button",
      class: isConnected() ? "btn" : "link",
      text: isConnected() ? "Edit" : CONNECT_HINT,
      "aria-expanded": editing ? "true" : "false",
      "data-focus": "edit|" + cfg.id
    });
    editButton.addEventListener("click", function () {
      if (!requireConnected()) return;
      if (state.editing === cfg.id) closeEditor();
      else openEditor(cfg.id);
    });
    section.appendChild(el("div", { class: "search-head" }, [
      el("h2", { text: name }),
      searchMeta(cfg),
      el("div", { class: "search-actions" }, [editButton])
    ]));
    var status = pendingLine("search|" + cfg.id);
    if (status) section.appendChild(status);
    if (editing && state.draft) section.appendChild(editorPanel(cfg));
    if (live && Array.isArray(live.stays)) {
      var summary = summarize(live);
      section.appendChild(kpiRow(live, summary));
      var split = el("div", { class: "split" });
      split.appendChild(staysCard(live, summary));
      if (live.stays.length >= 3) split.appendChild(heatCard(live, heatReference(summary)));
      section.appendChild(split);
    } else {
      section.appendChild(scanCard());
    }
    return section;
  }

  function skeleton() {
    return el("div", { "aria-hidden": "true" }, [
      el("div", { class: "skel kpi-skel" }),
      el("div", { class: "skel table-skel" })
    ]);
  }

  function emptyCard(title, body) {
    return el("section", { class: "card empty" }, [
      el("h2", { text: title }),
      body ? el("p", { text: body }) : null
    ]);
  }

  function addRow() {
    var connected = isConnected();
    var button = el("button", {
      type: "button",
      class: connected ? "btn" : "link",
      text: connected ? "Add search" : CONNECT_HINT,
      "data-focus": "add"
    });
    button.addEventListener("click", addSearchFlow);
    return el("div", { class: "add-row" }, [button]);
  }

  function renderBanner() {
    var banner = $("banner");
    if (!sampleName) {
      banner.hidden = true;
      banner.textContent = "";
      return;
    }
    banner.hidden = false;
    banner.textContent = "";
    banner.appendChild(el("span", {}, [el("b", { text: "Sample" }), sampleName, " · changes stay on this page"]));
    banner.appendChild(el("a", { href: window.location.pathname, text: "Hide sample" }));
  }

  function renderNotes() {
    var notes = $("notes");
    notes.textContent = "";
    if (state.notice) {
      var isError = state.notice.kind === "error";
      var noteEl = el("div", { class: "note" + (isError ? " error" : ""), role: isError ? "alert" : "status" }, [
        el("span", { text: state.notice.text })
      ]);
      var dismiss = el("button", { type: "button", class: "link", text: "Dismiss", "data-focus": "dismiss" });
      dismiss.addEventListener("click", function () {
        state.notice = null;
        renderApp();
      });
      noteEl.appendChild(dismiss);
      notes.appendChild(noteEl);
    }
    if (state.busy) notes.appendChild(el("p", { class: "note", role: "status", text: "Saving…" }));
    if (state.error || state.configError) {
      var message = state.error && state.configError
        ? "Couldn't read the scan or the config. Try again in a moment."
        : state.error
          ? "Couldn't read the latest scan. Try again in a moment."
          : "Couldn't read config.json. Try again in a moment.";
      var failed = el("div", { class: "note", role: "alert" }, [el("span", { text: message })]);
      var retry = el("button", { type: "button", class: "link", text: "Try again" });
      retry.addEventListener("click", load);
      failed.appendChild(retry);
      notes.appendChild(failed);
    }
    if (state.historyFailed) notes.appendChild(el("p", { class: "note", text: "Price history didn't load." }));
    var p = state.pending;
    if (p && p.scope === "config") notes.appendChild(el("p", { class: "note", role: "status", text: pendingText(p) }));
  }

  function renderApp() {
    disconnectObservers();
    gear.classList.toggle("has-slug", !!state.slug);
    var focusKey = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute("data-focus") : null;
    renderBanner();
    renderNotes();
    var app = $("app");
    app.textContent = "";
    app.setAttribute("aria-busy", state.loading || state.busy ? "true" : "false");

    if (state.loading) {
      app.appendChild(skeleton());
    } else {
      app.appendChild(trackedSection());
      var rows = state.config.searches.map(function (cfg) {
        return { cfg: cfg, live: state.latest ? findById(state.latest.searches, cfg.id) : null };
      });
      if (!rows.length) {
        if (!state.latest && !state.error) app.appendChild(emptyCard("No scans yet", "Prices appear here after the first scan."));
        else app.appendChild(emptyCard("No searches", "Add a search to start watching prices."));
      } else if (rows.length > 2) {
        var current = rows[0];
        if (state.active) {
          rows.forEach(function (row) { if (row.cfg.id === state.active) current = row; });
        }
        var seg = el("div", { class: "seg", role: "group", "aria-label": "Searches" });
        rows.forEach(function (row) {
          var tabName = displayName(row.cfg, row.live, scanYear());
          var tab = el("button", {
            type: "button",
            "aria-pressed": row === current ? "true" : "false",
            text: tabName,
            "data-tip": tabName,
            "data-focus": "tab|" + row.cfg.id
          });
          tab.addEventListener("click", function () {
            state.active = row.cfg.id;
            renderApp();
          });
          seg.appendChild(tab);
        });
        app.appendChild(seg);
        app.appendChild(searchPanel(current));
      } else {
        rows.forEach(function (row) { app.appendChild(searchPanel(row)); });
      }
      app.appendChild(addRow());
    }
    updatePill();
    if (focusKey) {
      var target = findByAttr("data-focus", focusKey);
      if (target) target.focus({ preventScroll: true });
    }
  }

  /* Saving: GET the fresh config, apply the change to that copy, PUT it back. A 409 or 422 re-reads and retries once. */
  async function ghReadConfig(repo, token) {
    var res;
    try {
      res = await fetch(ghFileUrl(repo), { headers: ghHeaders(token, false), cache: "no-store" });
    } catch (e) {
      throw new Error("Couldn't reach GitHub.");
    }
    if (res.status === 404) return { sha: null, config: null };
    if (!res.ok) throw new Error(ghErrorText(res.status));
    var body = await res.json();
    var config;
    try {
      config = readConfig(JSON.parse(base64ToUtf8(body.content)));
    } catch (e) {
      throw new Error("config.json on GitHub isn't valid JSON.");
    }
    if (!config) throw new Error("config.json on GitHub isn't an object.");
    return { sha: body.sha || null, config: config };
  }

  async function commitChange(mutate, message) {
    if (sampleName) {
      var local = mutate(clone(state.config));
      return { config: local, changed: !sameJson(local, state.config) };
    }
    var repo = state.repo;
    var token = state.token;
    var attempt = 0;
    for (;;) {
      var current = await ghReadConfig(repo, token);
      var fresh = current.config || emptyConfig();
      var next = mutate(clone(fresh));
      if (sameJson(next, fresh)) return { config: fresh, changed: false };
      var body = { message: message, content: utf8ToBase64(encodeConfig(next)) };
      if (current.sha) body.sha = current.sha;
      var res;
      try {
        res = await fetch(ghFileUrl(repo), {
          method: "PUT",
          headers: ghHeaders(token, true),
          body: JSON.stringify(body),
          cache: "no-store"
        });
      } catch (e) {
        throw new Error("Couldn't reach GitHub.");
      }
      if (res.ok) return { config: next, changed: true };
      if ((res.status === 409 || res.status === 422) && attempt === 0) {
        attempt += 1;
        continue;
      }
      throw new Error(ghErrorText(res.status));
    }
  }

  async function runEdit(scope, mutate, message, onDone) {
    if (state.busy) return;
    if (!requireConnected()) return;
    state.busy = true;
    state.notice = null;
    renderApp();
    try {
      var result = await commitChange(mutate, message);
      state.busy = false;
      state.config = result.config;
      if (result.changed) startPending(scope);
      else state.notice = { kind: "info", text: "Nothing changed." };
      if (onDone) onDone(result);
    } catch (e) {
      state.busy = false;
      state.notice = { kind: "error", text: "Couldn't save. " + (e && e.message ? e.message : "Try again.") };
    }
    renderApp();
  }

  function startPending(scope) {
    var baseline = state.latest ? state.latest.scanned_at : null;
    state.pending = { scope: scope, since: Date.now(), baseline: baseline, gaveUp: false, sample: !!sampleName };
    if (!sampleName) schedulePoll();
  }

  function schedulePoll() {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(pollTick, POLL_MS);
  }

  async function pollTick() {
    pollTimer = null;
    var p = state.pending;
    if (!p || p.sample) return;
    var latest = null;
    try {
      var res = await fetch(LATEST_URL, { cache: "no-cache" });
      if (res.ok) latest = await res.json();
    } catch (e) {
      latest = null;
    }
    if (state.pending !== p) return;
    var fresh = latest && Array.isArray(latest.searches) ? latest : null;
    var decision = pollDecision(p.since, Date.now(), p.baseline, fresh ? fresh.scanned_at : null);
    if (decision === "done") {
      state.latest = fresh;
      state.error = false;
      state.pending = null;
      await refreshHistory();
      renderApp();
      return;
    }
    if (decision === "gave-up") {
      p.gaveUp = true;
      renderApp();
      return;
    }
    schedulePoll();
  }

  async function refreshHistory() {
    try {
      var res = await fetch(HISTORY_URL, { cache: "no-cache" });
      var history = res.ok ? await res.json() : {};
      state.history = history && typeof history === "object" ? history : {};
      state.historyFailed = false;
    } catch (e) {
      state.history = {};
      state.historyFailed = true;
    }
  }

  async function fetchJson(url) {
    var res = await fetch(url, { cache: "no-cache" });
    if (res.status === 404) return { missing: true };
    if (!res.ok) throw new Error(url + " " + res.status);
    return { body: await res.json() };
  }

  async function load() {
    state.loading = true;
    state.error = false;
    state.configError = false;
    state.historyFailed = false;
    renderApp();
    var latest = null;
    var error = false;
    var config = emptyConfig();
    var configError = false;
    try {
      var lr = await fetchJson(LATEST_URL);
      if (!lr.missing) {
        if (!lr.body || typeof lr.body !== "object" || !Array.isArray(lr.body.searches)) {
          throw new Error("latest has no searches");
        }
        latest = lr.body;
      }
    } catch (e) {
      error = true;
    }
    try {
      var cr = await fetchJson(CONFIG_URL);
      config = cr.missing ? emptyConfig() : readConfig(cr.body);
      if (!config) throw new Error("config is not an object");
    } catch (e) {
      configError = true;
      config = emptyConfig();
    }
    state.latest = latest;
    state.error = error;
    state.config = config;
    state.configError = configError;
    if (latest) await refreshHistory();
    else state.history = {};
    state.loading = false;
    renderApp();
  }

  state.slug = readSlug();
  state.token = (function () {
    var v = storeGet(TOKEN_KEY);
    return isFineGrainedToken(v) ? v : "";
  })();
  state.repo = (function () {
    var v = storeGet(REPO_KEY);
    return isValidRepo(v) ? v : repoFromLocation(window.location.hostname, window.location.pathname);
  })();
  window.setInterval(updatePill, 60000);
  renderApp();
  load();
})();
</script>

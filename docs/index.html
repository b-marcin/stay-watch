<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Stay Watch</title>
<style>
  /* Tokens: one name, a light and a dark value. Dark follows the system unless data-theme pins it. */
  :root {
    color-scheme: light;
    --page: #f8f8f6;
    --card: #ffffff;
    --soft: #f1f1ef;
    --ink: #17171a;
    --ink-2: #48484d;
    --muted: #66666d;
    --line: rgb(0 0 0 / .075);
    --line-strong: rgb(0 0 0 / .14);
    --accent: #3e63dd;
    --on-accent: #ffffff;
    --money: #0f7f57;
    --down: #d23f45;
    --warn: #c98a00;
    --tip: #1f2530;
    --live: #12a150;
    --shadow-card: 0 1px 2px rgb(0 0 0 / .04), 0 1px 1px rgb(0 0 0 / .02);
    --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / .18), 0 0 0 1px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0b0b0d;
      --card: #141417;
      --soft: #1c1c20;
      --ink: #f3f3f5;
      --ink-2: #c4c4ca;
      --muted: #8c8c95;
      --line: rgb(255 255 255 / .08);
      --line-strong: rgb(255 255 255 / .16);
      --accent: #7b96ff;
      --on-accent: #0b0b0d;
      --money: #34c48b;
      --down: #ff6b70;
      --warn: #f6b100;
      --tip: #2a3548;
      --live: #34c48b;
      --shadow-card: none;
      --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / .6), 0 0 0 1px rgb(255 255 255 / .08);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0b0b0d;
    --card: #141417;
    --soft: #1c1c20;
    --ink: #f3f3f5;
    --ink-2: #c4c4ca;
    --muted: #8c8c95;
    --line: rgb(255 255 255 / .08);
    --line-strong: rgb(255 255 255 / .16);
    --accent: #7b96ff;
    --on-accent: #0b0b0d;
    --money: #34c48b;
    --down: #ff6b70;
    --warn: #f6b100;
    --tip: #2a3548;
    --live: #34c48b;
    --shadow-card: none;
    --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / .6), 0 0 0 1px rgb(255 255 255 / .08);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  input::placeholder { color: var(--muted); opacity: .8; }
  select option { background: var(--card); color: var(--ink); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .chart:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 16px 40px; }
  @media (min-width: 720px) { .wrap { padding: 24px 28px 56px; } }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .tools { display: flex; align-items: center; gap: 8px; position: relative; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
    border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card);
    color: var(--ink-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; }
  .pill.stale {
    background: color-mix(in srgb, var(--warn) 16%, var(--card));
    border-color: color-mix(in srgb, var(--warn) 45%, transparent);
    color: var(--ink);
  }
  .pill.stale .dot { background: var(--warn); }
  .icon-btn {
    position: relative; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; flex: none;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); cursor: pointer;
  }
  .icon-btn:hover { background: var(--soft); }
  .icon-btn.has-slug::after {
    content: ""; position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px var(--card);
  }
  .pop {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
    width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 96px); overflow: auto; padding: 14px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-pop);
  }
  .pop h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .pop-sec + .pop-sec { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .pop-hint {
    margin: 0 0 12px; padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--ink);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .pop label, .pop .lbl { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .pop input {
    width: 100%; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--line-strong); font-size: 14px;
  }
  .pop input[aria-invalid="true"] { border-color: var(--down); }
  .pop .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .pop .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .pop .masked {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px;
    padding: 0 6px 0 10px; border-radius: 10px; border: 1px solid var(--line-strong);
  }
  .pop .masked code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pop .form-status { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .pop .form-status.error { color: var(--down); }
  .howto { margin: 12px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
  .howto li + li { margin-top: 3px; }
  .howto a { color: var(--accent); font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
    font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; cursor: pointer;
  }
  .btn:hover { background: var(--soft); }
  .btn:disabled { opacity: .45; cursor: default; background: var(--card); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn.primary:disabled { background: var(--accent); }
  .btn.danger { color: var(--down); }
  .link {
    background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .link:disabled { opacity: .45; cursor: default; }

  .banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
    margin-top: 14px; padding: 8px 12px; border-radius: 12px; font-size: 13px; color: var(--ink-2);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .banner b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin-right: 6px; }
  .banner a { color: var(--accent); font-weight: 500; }

  .note {
    margin: 14px 0 0; padding: 9px 12px; border-radius: 12px; background: var(--soft);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px;
    font-size: 13px; color: var(--ink-2);
  }
  .note.error { background: color-mix(in srgb, var(--down) 12%, var(--soft)); color: var(--ink); }

  /* Segmented controls: they shrink and truncate, never scroll */
  .seg {
    display: flex; gap: 2px; padding: 3px; margin-top: 18px; max-width: 100%;
    background: var(--soft); border-radius: 12px;
  }
  .seg button {
    flex: 1 1 0; min-width: 0; height: 30px; padding: 0 10px; border: 0; border-radius: 9px;
    background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] {
    background: var(--card); color: var(--ink); box-shadow: var(--shadow-card), 0 0 0 1px var(--line);
  }
  .seg.mini { margin: 0; height: 30px; padding: 2px; flex: none; }
  .seg.mini button { flex: 0 0 auto; height: 26px; padding: 0 9px; font-size: 12.5px; white-space: nowrap; }

  /* Tracked trips */
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin: 0 0 10px; }
  .sec-head h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .tracked { margin-top: 22px; }
  .empty-line {
    margin: 0; padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: 16px;
    color: var(--muted); font-size: 13px;
  }
  .trips { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 720px) { .trips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1120px) { .trips { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .trip {
    min-width: 0; padding: 14px 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow-card);
  }
  .trip-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .trip-title, .trip-title-text { min-width: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
  .trip-nights { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trip-price {
    margin-top: 10px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .trip-price.none { font-size: 18px; font-weight: 600; color: var(--muted); }
  .trip-sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .trip-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin: 12px 0 0; }
  .fact { min-width: 0; }
  .fact dt { font-size: 12px; color: var(--muted); }
  .fact dd { margin: 2px 0 0; min-width: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .fact .v { font-size: 15px; font-weight: 600; }
  .fact .s { margin-left: 6px; font-size: 12px; color: var(--muted); }
  .fact dd.good .v { color: var(--money); }
  .fact dd.bad .v { color: var(--down); }
  .trip-detail { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .trip .chips { margin-top: 10px; }
  .trip .chart-box { margin-top: 12px; }
  .trip-controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px;
    padding-top: 12px; border-top: 1px solid var(--line);
  }
  .below { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .suffix-field { display: inline-flex; align-items: center; gap: 6px; }
  .below input, .val input {
    width: 96px; height: 30px; padding: 0 8px; border-radius: 9px; background: var(--card);
    border: 1px solid var(--line-strong); font-size: 13.5px; font-variant-numeric: tabular-nums;
  }
  .suffix { font-size: 12.5px; color: var(--muted); }
  .trip-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .trip-foot .btn:last-child { margin-left: auto; }
  .trip.sold .trip-title, .trip.sold .trip-title-text { color: var(--ink-2); }
  .trip.sold .trip-detail { color: var(--muted); }

  /* Search */
  .search { margin-top: 22px; }
  .search-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 0 0 12px; }
  .search h2 { margin: 0; min-width: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .search-actions { margin-left: auto; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta span {
    padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--ink-2);
    font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .pending { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; color: var(--ink-2); }
  .pending::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pending::before { animation: none; } }

  /* Inline editor */
  .editor {
    margin: 0 0 16px; padding: 16px; display: grid; gap: 16px; min-width: 0;
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: var(--shadow-card);
  }
  .ed-grid { display: grid; gap: 14px 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .ed-grid .f-wide { grid-column: 1 / -1; }
  .field { display: grid; gap: 6px; min-width: 0; align-content: start; }
  .field-label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field select {
    width: 100%; height: 38px; min-width: 0; padding: 0 10px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); font-size: 14px;
  }
  .field input[type="date"] { font-variant-numeric: tabular-nums; }
  .field input[aria-invalid="true"], .alert-row select[aria-invalid="true"] { border-color: var(--down); }
  .field-err { margin: 0; font-size: 12px; color: var(--down); overflow-wrap: anywhere; }
  .field-err:empty { display: none; }
  .field-hint { margin: 0; font-size: 12px; color: var(--muted); }
  .step-row { display: flex; align-items: center; gap: 6px; }
  .step-btn {
    width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink); font-size: 17px; line-height: 1; cursor: pointer;
  }
  .step-btn:hover:not(:disabled) { background: var(--soft); }
  .step-btn:disabled { opacity: .4; cursor: default; }
  .step-row output { min-width: 36px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .days button {
    height: 36px; padding: 0; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink-2); font-size: 12.5px; cursor: pointer;
  }
  .days button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--ink);
    border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .alerts { display: grid; gap: 8px; }
  .alert-item { display: grid; gap: 4px; }
  .alert-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 36px; gap: 8px; align-items: center; }
  .alert-row select {
    width: 100%; height: 38px; min-width: 0; padding: 0 8px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); font-size: 14px;
  }
  .val { display: inline-flex; align-items: center; gap: 6px; }
  .val input { width: 7.5rem; height: 38px; font-size: 14px; }
  .icon-btn-s {
    width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink-2); font-size: 18px; line-height: 1; cursor: pointer;
  }
  .icon-btn-s:hover { background: var(--soft); }
  .preview { margin: 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .preview:empty { display: none; }
  .ed-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ed-actions .spacer { flex: 1 1 auto; }
  .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .add-row { margin-top: 18px; display: flex; }

  /* Scanning state */
  .scan { margin-top: 16px; padding: 16px; }
  .scan-line { margin: 0; color: var(--muted); }
  .scan-skel { margin-top: 12px; height: 120px; border-radius: 12px; }

  /* Cards and split */
  .split { display: grid; gap: 16px; margin-top: 16px; }
  .card {
    min-width: 0; overflow: hidden; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow-card);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
  .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }

  /* KPI strip: one card, hairlines drawn by the 1px grid gap */
  .kpis {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow-card); margin-top: 16px;
  }
  .kpi { min-width: 0; padding: 14px 16px 15px; background: var(--card); }
  .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (min-width: 720px) {
    .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .kpi:last-child:nth-child(odd) { grid-column: auto; }
  }
  .kpi-label { font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-value {
    margin-top: 4px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  @media (min-width: 720px) { .kpi-value { font-size: 28px; } }
  .kpi-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi-value.good { color: var(--money); }
  .kpi-value.none { color: var(--muted); font-weight: 500; }

  /* Stays table: real ARIA table on grid rows; phones reflow each row into three lines */
  .tbl { font-variant-numeric: tabular-nums; }
  .tr {
    display: grid; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line);
    grid-template-columns: minmax(0, 1.35fr) minmax(0, .8fr) minmax(0, .7fr) minmax(0, 1.55fr) 148px;
  }
  .tr.head { border-top: 0; padding-top: 4px; padding-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .tr:not(.head) { cursor: pointer; }
  .tr:not(.head):hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
  .tr.open { background: color-mix(in srgb, var(--accent) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); }
  .tr.sold { color: var(--muted); }
  .tr .num { justify-self: end; text-align: right; }
  .c-act { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .stay-btn {
    display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; padding: 0; border: 0;
    background: none; text-align: left; cursor: pointer; font-weight: 500;
  }
  .stay-btn svg { flex: none; color: var(--muted); transition: transform .15s ease; }
  .stay-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
  .price { font-size: 15px; font-weight: 650; }
  .was { display: block; font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .unit { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--ink);
    font-size: 12px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .chip.drop::before { content: none; }
  .tfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 12px;
    border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
  }
  .cell-note { padding: 14px 16px; color: var(--muted); }
  .tr.empty-row { cursor: default; }
  .tr.empty-row:hover { background: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .icon-btn.track { width: 32px; height: 32px; }

    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card));
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .icon-btn.track[aria-pressed="true"] svg { fill: currentColor; }
  .icon-btn.track:hover { background: var(--soft); }

  .chart-box { min-width: 0; }
  .tr-detail { display: block; padding: 2px 16px 16px; }
  .chart { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart .grid { stroke: var(--line-strong); stroke-width: 1; opacity: .55; }
  .chart .ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .ref-alert { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .chart .ref-low { stroke: var(--muted); stroke-width: 1; }
  .chart .ref-first { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 1 3; stroke-linecap: round; }
  .chart .ref-lowest { stroke: var(--money); stroke-width: 1; stroke-dasharray: 5 3; opacity: .75; }
  .chart .ref-label { font-size: 11px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chart .ref-label.low { fill: var(--muted); }
  .chart .ref-label.first { fill: var(--ink-2); }
  .chart .ref-label.lowest { fill: var(--money); }
  .chart .step { fill: none; stroke: var(--money); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--card); stroke: var(--money); stroke-width: 2; }
  .chart .dot.gone { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  .chart .hl { fill: var(--money); stroke: var(--card); stroke-width: 2; }
  .chart .cursor { stroke: var(--ink-2); stroke-width: 1; opacity: .45; }

  /* Heatmap: check-in calendar, weeks as columns */
  .cal-wrap { padding: 2px 16px 16px; overflow-x: auto; }
  .cal {
    --cell: 22px;
    display: grid; width: max-content; gap: 3px;
    grid-template-columns: 14px repeat(var(--cols, 1), var(--cell));
    grid-template-rows: 16px repeat(var(--rows, 7), var(--cell));
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  @media (max-width: 719px) { .cal { --cell: 19px; } }
  /* Wide screens: the calendar fills the card, one column per week, with the compact price in each cell. */
  @media (min-width: 720px) {
    .cal {
      width: 100%;
      grid-template-columns: 24px repeat(var(--cols, 1), minmax(46px, 1fr));
      grid-template-rows: 18px repeat(var(--rows, 7), 32px);
    }
    .cal .cell { width: 100%; height: 32px; font-size: 11.5px; line-height: 1; }
    .cal .cell { flex-direction: column; gap: 2px; line-height: 1; }
    .cal .cell .d { font-size: 10px; color: var(--muted); font-weight: 500; }
    .cal .cell .p { font-size: 11.5px; color: var(--ink); font-weight: 600; }
    .cal .cell.under .p { font-weight: 700; }
  }
  .cell .p { display: none; }
  @media (min-width: 720px) { .cell .p { display: inline; } }
  .cal .mon { align-self: end; white-space: nowrap; font-size: 11px; color: var(--muted); }
  .cal .wd { display: grid; place-items: center; font-size: 10px; color: var(--muted); }
  .cell {
    width: var(--cell); height: var(--cell); padding: 0; border: 0; border-radius: 7px;
    display: flex; align-items: center; justify-content: center; background: transparent; color: var(--ink);
    font-size: 10px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cell.far {
    background: color-mix(in srgb, var(--money) 8%, transparent);
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .cell.mid { background: color-mix(in srgb, var(--money) 15%, transparent); }
  .cell.near { background: color-mix(in srgb, var(--money) 26%, transparent); }
  .cell.under {
    background: color-mix(in srgb, var(--warn) 34%, transparent); font-weight: 700;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 75%, transparent);
  }
  .cell.sold { border: 1px dashed var(--line-strong); color: var(--muted); }
  .cell[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 0 16px 12px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
  .legend .cell { width: 12px; height: 12px; border-radius: 4px; cursor: default; }
  .legend .cell.sold { border-width: 1px; }

  /* KPI and table on phones */
  @media (max-width: 899px) {
    .tr.head { display: none; }
    .tr {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "stay total" "night act" "flags flags";
      gap: 6px 12px; padding: 12px 14px;
    }
    .tr .c-stay { grid-area: stay; }
    .tr .c-total { grid-area: total; }
    .tr .c-night { grid-area: night; }
    .tr .c-act { grid-area: act; }
    .tr .c-flags { grid-area: flags; }
    .tr .num { justify-self: end; }
    .tr .c-flags:empty { display: none; }
    .tr .c-night { justify-self: start; text-align: left; }
    .tr .unit { display: inline; color: var(--muted); }
    .tr-detail { padding: 2px 14px 14px; }
    .tfoot, .cell-note { padding-left: 14px; padding-right: 14px; }
  }

  /* Empty, loading, error */
  .empty { margin-top: 22px; padding: 30px 20px; text-align: center; }
  .empty h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .empty p { margin: 6px 0 0; color: var(--muted); }
  .empty .btn { margin-top: 14px; }
  .skel {
    border-radius: 16px; background: linear-gradient(90deg, var(--soft) 25%, color-mix(in srgb, var(--soft) 55%, var(--card)) 37%, var(--soft) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  .skel.kpi-skel { margin-top: 22px; height: 96px; }
  .skel.table-skel { margin-top: 16px; height: 260px; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } .stay-btn svg { transition: none; } }

  /* Tooltip: one system for the whole page */
  .tip {
    position: fixed; z-index: 60; left: 0; top: 0; pointer-events: none;
    max-width: min(280px, calc(100vw - 16px)); padding: 8px 10px; border-radius: 10px;
    background: var(--tip); color: #ffffff; box-shadow: var(--shadow-pop);
    font-size: 12px; line-height: 1.35; font-variant-numeric: tabular-nums;
  }
  .tip-main { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .tip-main:empty { display: none; }
  .tip-sub { display: block; color: rgb(255 255 255 / .78); }
  .tip-sub:empty { display: none; }
</style>

<script id="pure">
/* Pure functions: no DOM access. Extracted and tested by out/test_page_totals.mjs. */
var STALE_AFTER_HOURS = 7;
var SLUG_PATTERN = /^[A-Za-z0-9_-]{1,80}$/;
var NNBSP = " ";
var NBSP = " ";
var MINUS = "−";
var ARROW = "→";
var DASH = "—";
var DAY_MS = 86400000;
var HEAT_NEAR = 1.10;
var HEAT_MID = 1.25;
var CHART_STEPS = [5000, 10000, 20000, 25000, 50000, 100000];
var WEEKDAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
var WEEKDAY_LETTER = ["M", "T", "W", "T", "F", "S", "S"];
var WEEKDAY_NAME = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
var MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function isNumber(value) {
  return typeof value === "number" && isFinite(value);
}

function roundHalfUp(value) {
  return (value < 0 ? -1 : 1) * Math.round(Math.abs(value));
}

function pad2(n) {
  return (n < 10 ? "0" : "") + n;
}

function groupDigits(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP);
}

/* 1270 -> "1 270 zł"; cents only when present, "123,45 zł". */
function formatPln(grosze) {
  if (!isNumber(grosze)) return DASH;
  var sign = grosze < 0 ? MINUS : "";
  var abs = Math.round(Math.abs(grosze));
  var whole = Math.floor(abs / 100);
  var rest = abs % 100;
  return sign + groupDigits(whole) + (rest ? "," + pad2(rest) : "") + NBSP + "zł";
}

/* Compact whole-złoty price for dense cells: 100300 -> "1 003". */
function formatCompactPln(grosze) {
  if (!isNumber(grosze)) return DASH;
  return groupDigits(Math.round(grosze / 100));
}

/* Axis labels: 1200 -> "1,2k" and 950 -> "950" when compact; with compact off, 1200 -> "1 200". Compact applies
   only to whole hundreds, and pickAxis allows it only on whole-hundred steps, so neighbours never round together. */
function formatAxisPln(grosze, compact) {
  var pln = Math.round(grosze / 100);
  if (compact !== false && Math.abs(pln) >= 1000 && pln % 100 === 0) {
    return (pln / 1000).toString().replace(".", ",") + "k";
  }
  return groupDigits(pln);
}

/* Signed whole percent with a real minus; zero reads ±0%. */
function formatSignedPct(value) {
  if (!isNumber(value)) return DASH;
  var r = roundHalfUp(value);
  if (r === 0) return "±0%";
  return (r > 0 ? "+" : MINUS) + Math.abs(r) + "%";
}

/* Signed złoty change: "−57 zł", "+35 zł", "±0 zł". */
function formatSignedPln(grosze) {
  if (!isNumber(grosze)) return DASH;
  if (grosze === 0) return "±" + formatPln(0);
  return (grosze > 0 ? "+" : MINUS) + formatPln(Math.abs(grosze));
}

/* Price drop label: "▼ 13%", "▼ <1%" under half a percent. */
function formatDrop(pct) {
  var r = roundHalfUp(pct);
  return r < 1 ? "▼ <1%" : "▼ " + r + "%";
}

function parseIsoDay(iso) {
  if (typeof iso !== "string") return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}

/* "Fri 5 Dec" */
function formatDay(iso) {
  var t = parseIsoDay(iso);
  if (t === null) return DASH;
  var d = new Date(t);
  return WEEKDAY_SHORT[d.getUTCDay()] + NBSP + d.getUTCDate() + NBSP + MONTH_SHORT[d.getUTCMonth()];
}

/* "Fri 5 Dec → Sun 7 Dec" */
function formatStay(checkIn, checkOut) {
  return formatDay(checkIn) + " " + ARROW + " " + formatDay(checkOut);
}

/* "1 Dec 2026 – 1 Mar 2027" */
function formatWindow(start, end) {
  function part(iso) {
    var t = parseIsoDay(iso);
    if (t === null) return DASH;
    var d = new Date(t);
    return d.getUTCDate() + NBSP + MONTH_SHORT[d.getUTCMonth()] + NBSP + d.getUTCFullYear();
  }
  return part(start) + " – " + part(end);
}

function isoOffsetMinutes(iso) {
  if (typeof iso !== "string") return 0;
  if (/Z$/.test(iso)) return 0;
  var m = /([+-])(\d{2}):?(\d{2})$/.exec(iso);
  if (!m) return 0;
  var minutes = (+m[2]) * 60 + (+m[3]);
  return m[1] === "-" ? -minutes : minutes;
}

/* Wall-clock parts of an instant in the scanner's own offset (Warsaw in production). */
function wallParts(ms, offsetMinutes) {
  var d = new Date(ms + offsetMinutes * 60000);
  return { day: d.getUTCDate(), month: d.getUTCMonth(), year: d.getUTCFullYear(), hh: d.getUTCHours(), mm: d.getUTCMinutes() };
}

function formatDayMonth(ms, offsetMinutes) {
  var p = wallParts(ms, offsetMinutes);
  return p.day + NBSP + MONTH_SHORT[p.month];
}

function formatDayMonthTime(ms, offsetMinutes) {
  var p = wallParts(ms, offsetMinutes);
  return p.day + NBSP + MONTH_SHORT[p.month] + NBSP + pad2(p.hh) + ":" + pad2(p.mm);
}

/* Freshness pill. Floors minutes and hours; stale when older than 7 hours. */
function freshness(scannedAt, nowMs) {
  var then = Date.parse(scannedAt);
  if (!isNumber(then)) return { known: false, stale: false, label: "updated " + DASH, ageMinutes: null };
  var age = Math.max(0, nowMs - then);
  var minutes = Math.floor(age / 60000);
  var hours = Math.floor(age / 3600000);
  var days = Math.floor(age / DAY_MS);
  var label;
  if (minutes < 1) label = "updated just now";
  else if (minutes < 60) label = "updated " + minutes + " min ago";
  else if (hours < 24) label = "updated " + hours + " h ago";
  else label = "updated " + days + " d ago";
  return { known: true, stale: age > STALE_AFTER_HOURS * 3600000, label: label, ageMinutes: minutes };
}

function isPriced(stay) {
  return !!stay && !stay.sold_out && isNumber(stay.price);
}

function isUnderRule(rule) {
  return rule.indexOf("below:") === 0 || rule.indexOf("per_night_below:") === 0;
}

/* Under a configured threshold. Trusts matched_rules, as the store wrote them. */
function isUnder(stay) {
  return isPriced(stay) && (stay.matched_rules || []).some(isUnderRule);
}

/* Cheaper than the hotel's own 30-day lowest: the store's below_recent_lowest condition. */
function isBelowLowest(stay) {
  return isPriced(stay) && isNumber(stay.recent_lowest) && stay.price < stay.recent_lowest;
}

function isDropped(stay) {
  return isPriced(stay) && isNumber(stay.previous_price) && stay.previous_price > stay.price;
}

function hasFewRooms(stay) {
  return isPriced(stay) && isNumber(stay.rooms_left) && stay.rooms_left <= 2;
}

/* Attention flags for one stay, in display order. Each has a short label and a tooltip. */
function stayFlags(stay) {
  var out = [];
  if (isUnder(stay)) {
    out.push({ kind: "under", label: "Under alert", tip: "Under the alert threshold for this search" });
  }
  if (isBelowLowest(stay)) {
    out.push({ kind: "low", label: "30-day low", tip: "Below the hotel's lowest price of the last 30 days, " + formatPln(stay.recent_lowest) });
  }
  if (isDropped(stay)) {
    var pct = (stay.previous_price - stay.price) / stay.previous_price * 100;
    out.push({ kind: "drop", label: formatDrop(pct), tip: "Was " + formatPln(stay.previous_price) + " at the previous recorded price" });
  }
  if (hasFewRooms(stay)) {
    out.push({ kind: "rooms", label: stay.rooms_left + " left", tip: "Rooms left for this stay: " + stay.rooms_left });
  }
  return out;
}

function compareText(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

/* Priced stays by price, then sold-out stays by date (greyed, at the bottom). */
function orderStays(stays) {
  var list = Array.isArray(stays) ? stays : [];
  var priced = list.filter(isPriced).sort(function (a, b) {
    return (a.price - b.price) || compareText(a.check_in, b.check_in) || compareText(a.check_out, b.check_out);
  });
  var sold = list.filter(function (s) { return !isPriced(s); }).sort(function (a, b) {
    return compareText(a.check_in, b.check_in) || compareText(a.check_out, b.check_out);
  });
  return priced.concat(sold);
}

/* Threshold for the search: first below rule, else per_night_below times nights. */
function thresholdOf(search) {
  var alerts = search.alerts || [];
  for (var i = 0; i < alerts.length; i++) {
    var a = alerts[i];
    if (a && a.kind === "below" && isNumber(a.amount)) return { kind: "below", amount: a.amount, total: a.amount };
    if (a && a.kind === "per_night_below" && isNumber(a.amount)) {
      return { kind: "per_night", amount: a.amount, total: a.amount * search.nights };
    }
  }
  return null;
}

function summarize(search) {
  var stays = Array.isArray(search.stays) ? search.stays : [];
  var priced = stays.filter(isPriced);
  var cheapest = null;
  priced.forEach(function (s) {
    if (!cheapest || s.price < cheapest.price || (s.price === cheapest.price && s.check_in < cheapest.check_in)) {
      cheapest = s;
    }
  });
  var th = thresholdOf(search);
  var perNight = null;
  if (cheapest) {
    perNight = isNumber(cheapest.per_night) ? cheapest.per_night : Math.floor(cheapest.price / cheapest.nights);
  }
  return {
    total: stays.length,
    priced: priced.length,
    soldOut: stays.length - priced.length,
    cheapest: cheapest,
    perNight: perNight,
    threshold: th,
    underCount: priced.filter(isUnder).length,
    vsAlertPct: cheapest && th ? (cheapest.price - th.total) / th.total * 100 : null,
    lowest: cheapest && isNumber(cheapest.recent_lowest) ? cheapest.recent_lowest : null,
    vsLowPct: cheapest && isNumber(cheapest.recent_lowest) ? (cheapest.price - cheapest.recent_lowest) / cheapest.recent_lowest * 100 : null
  };
}

/* Heat reference: the alert total, else the cheapest priced stay. */
function heatReference(summary) {
  if (summary.threshold) return summary.threshold.total;
  return summary.cheapest ? summary.cheapest.price : null;
}

function heatTier(stay, ref) {
  if (!isPriced(stay)) return "sold";
  if (isUnder(stay)) return "under";
  if (!isNumber(ref) || ref <= 0) return "far";
  var ratio = stay.price / ref;
  if (ratio <= HEAT_NEAR) return "near";
  if (ratio <= HEAT_MID) return "mid";
  return "far";
}

/* Rows shown before "Show all": top N priced plus every priced stay with a flag. Everything when top is null
   or nothing is priced. Sold-out rows stay hidden until "Show all". */
function defaultRows(search) {
  var ordered = orderStays(search.stays);
  var anyPriced = ordered.some(isPriced);
  if (search.top === null || search.top === undefined || !anyPriced) return ordered;
  var rank = 0;
  return ordered.filter(function (s) {
    if (!isPriced(s)) return false;
    rank += 1;
    return rank <= search.top || stayFlags(s).length > 0;
  });
}

function isValidSlug(value) {
  return typeof value === "string" && SLUG_PATTERN.test(value);
}

/* The one allowed booking URL: the slug comes from localStorage at runtime. */
function bookUrl(slug, stay, adults) {
  if (!isValidSlug(slug) || !isPriced(stay)) return null;
  return "https://booking.profitroom.com/pl/" + encodeURIComponent(slug) +
    "/pricelist/rooms?check-in=" + encodeURIComponent(stay.check_in) +
    "&check-out=" + encodeURIComponent(stay.check_out) +
    "&r1_adults=" + encodeURIComponent(String(adults)) + "&currency=PLN";
}

function copyText(stay, adults) {
  return stay.check_in + " to " + stay.check_out + ", " + adults + (adults === 1 ? " adult" : " adults");
}

/* Price history for one stay: points sorted by time, end at the latest scan. */
function historySeries(rows, scannedAt) {
  var offset = isoOffsetMinutes(scannedAt);
  var points = [];
  (Array.isArray(rows) ? rows : []).forEach(function (row) {
    if (!Array.isArray(row) || typeof row[0] !== "string") return;
    var t = Date.parse(row[0]);
    if (!isNumber(t)) return;
    points.push({
      t: t,
      price: isNumber(row[1]) ? row[1] : null,
      offer: typeof row[2] === "string" ? row[2] : null,
      room: typeof row[3] === "string" ? row[3] : null
    });
  });
  points.sort(function (a, b) { return a.t - b.t; });
  var end = Date.parse(scannedAt);
  var last = points.length ? points[points.length - 1].t : null;
  if (!isNumber(end)) end = last;
  if (end !== null && last !== null && end < last) end = last;
  return { points: points, end: end, offset: offset };
}

function pickStep(range) {
  for (var i = 0; i < CHART_STEPS.length; i++) {
    if (range / CHART_STEPS[i] <= 4) return CHART_STEPS[i];
  }
  return CHART_STEPS[CHART_STEPS.length - 1];
}

/* Tick step and label style for one y axis. The style follows the step: whole-hundred steps (100 zł and up) may
   read "1,3k"; finer steps (50 zł, 250 zł) read "1 250", "1 300", so every tick reads differently. */
function pickAxis(lo, hi, pad) {
  var step = pickStep(hi - lo + 2 * pad);
  var yMin = Math.floor((lo - pad) / step) * step;
  var yMax = Math.ceil((hi + pad) / step) * step;
  if (yMax <= yMin) yMax = yMin + step;
  return { step: step, yMin: yMin, yMax: yMax, compact: step % 10000 === 0 };
}

var REF_LABEL = { alert: "alert", low: "30-day low", first: "first", lowest: "lowest" };

/* Geometry for the step chart. Returns null when there is no price to draw. Reference lines come from
   opts.threshold (alert) and opts.low (30-day low), plus opts.refs: [{kind, value}] with kind alert, low, first or
   lowest. */
function chartGeometry(series, opts) {
  var pts = series.points || [];
  if (!pts.length || series.end === null) return null;
  var prices = pts.filter(function (p) { return p.price !== null; }).map(function (p) { return p.price; });
  if (!prices.length) return null;
  var W = opts.width;
  var H = opts.height;
  var plot = { left: 46, right: W - 12, top: 14, bottom: H - 26 };
  var refs = [];
  if (isNumber(opts.threshold)) refs.push({ kind: "alert", value: opts.threshold });
  if (isNumber(opts.low)) refs.push({ kind: "low", value: opts.low });
  (opts.refs || []).forEach(function (r) {
    if (r && isNumber(r.value) && REF_LABEL[r.kind]) refs.push({ kind: r.kind, value: r.value });
  });
  var values = prices.concat(refs.map(function (r) { return r.value; }));
  var lo = Math.min.apply(null, values);
  var hi = Math.max.apply(null, values);
  var span = hi - lo;
  if (span <= 0) span = Math.max(hi, 1) * 0.1;
  var pad = span * 0.12;
  var axis = pickAxis(lo, hi, pad);
  var step = axis.step;
  var yMin = axis.yMin;
  var yMax = axis.yMax;
  var t0 = pts[0].t;
  var t1 = series.end;
  if (t1 <= t0) t1 = t0 + 3600000;
  function xOf(t) { return plot.left + (t - t0) / (t1 - t0) * (plot.right - plot.left); }
  function yOf(v) { return plot.bottom - (v - yMin) / (yMax - yMin) * (plot.bottom - plot.top); }

  var steps = [];
  var dots = [];
  pts.forEach(function (p, i) {
    var x1 = xOf(p.t);
    var x2 = xOf(i + 1 < pts.length ? pts[i + 1].t : t1);
    steps.push({ x1: x1, x2: x2, price: p.price, y: p.price === null ? null : yOf(p.price) });
    dots.push({ x: x1, y: p.price === null ? plot.bottom - 5 : yOf(p.price), idx: i, price: p.price, t: p.t, offer: p.offer });
  });

  var yTicks = [];
  for (var v = yMin; v <= yMax; v += step) {
    yTicks.push({ y: yOf(v), label: formatAxisPln(v, axis.compact) });
  }

  var xTicks = [];
  var n = W < 420 ? 3 : 4;
  for (var k = 0; k < n; k++) {
    var t = t0 + (t1 - t0) * k / (n - 1);
    xTicks.push({ x: xOf(t), label: formatDayMonth(t, series.offset), anchor: k === 0 ? "start" : k === n - 1 ? "end" : "middle" });
  }

  /* Reference lines and their labels. Low values sit their label under the line, the rest above it; a label that
     would touch the one before it is pushed down. */
  var refLines = refs.map(function (r) {
    var y = yOf(r.value);
    var below = r.kind === "low" || r.kind === "lowest";
    return {
      kind: r.kind,
      value: r.value,
      y: y,
      label: REF_LABEL[r.kind] + " " + formatPln(r.value),
      anchor: below ? "start" : "end",
      labelY: below ? y + 13 : y - 5
    };
  });
  var sorted = refLines.slice().sort(function (a, b) { return a.labelY - b.labelY; });
  var floor = -Infinity;
  sorted.forEach(function (r) {
    if (r.labelY < floor + 12) r.labelY = floor + 12;
    floor = r.labelY;
  });
  var alertRef = refLines.filter(function (r) { return r.kind === "alert"; })[0] || null;
  var lowRef = refLines.filter(function (r) { return r.kind === "low"; })[0] || null;

  return {
    width: W,
    height: H,
    plot: plot,
    yMin: yMin,
    yMax: yMax,
    t0: t0,
    t1: t1,
    steps: steps,
    dots: dots,
    yTicks: yTicks,
    xTicks: xTicks,
    refLines: refLines,
    alertY: alertRef ? alertRef.y : null,
    alertValue: alertRef ? alertRef.value : null,
    lowY: lowRef ? lowRef.y : null,
    lowValue: lowRef ? lowRef.value : null
  };
}

/* Check-in calendar: weeks as columns (Monday first), one row per weekday that holds a check-in in this search. */
function calendarLayout(stays, ref) {
  var items = [];
  var mondays = [];
  (Array.isArray(stays) ? stays : []).forEach(function (stay) {
    var t = parseIsoDay(stay.check_in);
    if (t === null) return;
    var index = (new Date(t).getUTCDay() + 6) % 7;
    var monday = t - index * DAY_MS;
    items.push({ stay: stay, t: t, row: index, monday: monday });
    mondays.push(monday);
  });
  if (!items.length) return { cols: 0, cells: [], months: [], weekdays: [] };
  var first = Math.min.apply(null, mondays);
  var last = Math.max.apply(null, mondays);
  var cols = Math.round((last - first) / (7 * DAY_MS)) + 1;
  /* Only weekdays that hold a check-in get a row. lane is that row's position in the grid, Monday first. */
  var used = [false, false, false, false, false, false, false];
  items.forEach(function (item) { used[item.row] = true; });
  var weekdays = [];
  used.forEach(function (on, day) { if (on) weekdays.push(day); });
  var cells = items.map(function (item) {
    return {
      stay: item.stay,
      col: Math.round((item.monday - first) / (7 * DAY_MS)),
      row: item.row,
      lane: weekdays.indexOf(item.row),
      day: new Date(item.t).getUTCDate(),
      tier: heatTier(item.stay, ref)
    };
  });
  var months = [];
  var previous = -1;
  for (var c = 0; c < cols; c++) {
    /* A week belongs to the month of its Thursday, the majority day of a Monday-first week. */
    var month = new Date(first + c * 7 * DAY_MS + 3 * DAY_MS).getUTCMonth();
    if (month !== previous) {
      months.push({ col: c, label: MONTH_SHORT[month] });
      previous = month;
    }
  }
  return { cols: cols, cells: cells, months: months, weekdays: weekdays };
}

/* ---- Round 2: config, editing, tracking, GitHub, polling ---- */

var DAY_TOKENS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
var DAY_JS = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
var DAY_SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
var ALERT_KINDS = ["below", "per_night_below", "drop_pct", "below_recent_lowest", "discounted"];
var ALERT_LABEL = {
  below: "Total below",
  per_night_below: "Per night below",
  drop_pct: "Drop of at least",
  below_recent_lowest: "Cheaper than 30-day low",
  discounted: "Discounted"
};
var NOTIFY_MODES = ["any", "drop"];
var NOTIFY_LABEL = { any: "Any change", drop: "Drops only" };
var ADD_DAYS = 60;
var POLL_MS = 20000;
var GIVE_UP_MS = 6 * 60000;
var MAX_PLN = 1000000;
var MAX_TOP = 50;
var TOKEN_PATTERN = /^github_pat_[A-Za-z0-9_]{20,255}$/;
var REPO_PATTERN = /^[A-Za-z0-9_.-]{1,100}\/[A-Za-z0-9_.-]{1,100}$/;

function hasOwn(obj, key) {
  return Object.prototype.hasOwnProperty.call(obj, key);
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function sameJson(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function findById(list, id) {
  var found = (Array.isArray(list) ? list : []).filter(function (item) { return item && item.id === id; });
  return found.length ? found[0] : null;
}

function isoFromTime(t) {
  var d = new Date(t);
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}

/* Calendar day in Warsaw (the scanner's zone) for an instant. Falls back to the local date. */
function todayIso(nowMs) {
  try {
    var parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Warsaw", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date(nowMs));
    var got = {};
    parts.forEach(function (p) { got[p.type] = p.value; });
    if (got.year && got.month && got.day) return got.year + "-" + got.month + "-" + got.day;
    throw new Error("no parts");
  } catch (e) {
    var d = new Date(nowMs);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
}

function addDays(iso, n) {
  var t = parseIsoDay(iso);
  return t === null ? null : isoFromTime(t + n * DAY_MS);
}

function nightsBetween(a, b) {
  var x = parseIsoDay(a);
  var y = parseIsoDay(b);
  return x === null || y === null ? null : Math.round((y - x) / DAY_MS);
}

function nightsText(n) {
  return n + (n === 1 ? " night" : " nights");
}

function adultsText(n) {
  return n + (n === 1 ? " adult" : " adults");
}

function countLabel(n) {
  if (n === 0) return "No stays to check";
  if (n === 1) return "1 stay to check";
  return n + " stays to check";
}

/* Scan year for a scan timestamp in its own offset; falls back to the UTC year of nowMs. */
function scanYearOf(scannedAt, nowMs) {
  var t = Date.parse(scannedAt);
  if (!isNumber(t)) return new Date(nowMs).getUTCFullYear();
  return wallParts(t, isoOffsetMinutes(scannedAt)).year;
}

function monthDay(t, withYear) {
  var d = new Date(t);
  return d.getUTCDate() + " " + MONTH_SHORT[d.getUTCMonth()] + (withYear ? " " + d.getUTCFullYear() : "");
}

/* Derived search name: "1 Dec – 1 Mar". Years show when the window crosses a year or starts in another year than
   the scan. Mirrors the rule the scanner writes into latest.json. */
function derivedName(from, to, scanYear) {
  var f = parseIsoDay(from);
  var t = parseIsoDay(to);
  if (f === null || t === null) return "";
  var fy = new Date(f).getUTCFullYear();
  var ty = new Date(t).getUTCFullYear();
  var withYear = fy !== ty || fy !== scanYear;
  return monthDay(f, withYear) + " – " + monthDay(t, withYear);
}

/* Shown name: a custom name from the config, else the scanner's name, else the name derived from the dates. */
function displayName(cfg, live, scanYear) {
  if (typeof cfg.name === "string" && cfg.name.trim()) return cfg.name.trim();
  if (live && live.custom_name !== true && typeof live.name === "string" && live.name) return live.name;
  return derivedName(cfg.from, cfg.to, scanYear) || "Search";
}

/* Check-ins the scanner plans: every check-in from max(from, today) through to − nights, where the stay covers each
   required weekday night (a stay covers night D when check_in ≤ D < check_out). Empty mustInclude means any check-in. */
function staysToCheck(from, to, nights, mustInclude, today) {
  var f = parseIsoDay(from);
  var t = parseIsoDay(to);
  var now = parseIsoDay(today);
  if (f === null || t === null || now === null || !isNumber(nights) || nights < 1 || nights > 60) return 0;
  var required = (Array.isArray(mustInclude) ? mustInclude : [])
    .map(function (tok) { return DAY_JS[tok]; })
    .filter(function (day) { return isNumber(day); });
  var last = t - nights * DAY_MS;
  var count = 0;
  for (var d = Math.max(f, now); d <= last; d += DAY_MS) {
    var ok = true;
    for (var r = 0; r < required.length && ok; r++) {
      var found = false;
      for (var k = 0; k < nights && !found; k++) {
        if (new Date(d + k * DAY_MS).getUTCDay() === required[r]) found = true;
      }
      ok = found;
    }
    if (ok) count += 1;
  }
  return count;
}

/* Weekday tokens, unique, Monday first. */
function orderDays(list) {
  var set = {};
  (Array.isArray(list) ? list : []).forEach(function (tok) {
    var key = String(tok).toLowerCase();
    if (DAY_TOKENS.indexOf(key) >= 0) set[key] = true;
  });
  return DAY_TOKENS.filter(function (tok) { return !!set[tok]; });
}

function clampInt(value, min, max, fallback) {
  if (!isNumber(value)) return fallback;
  var r = Math.round(value);
  return r >= min && r <= max ? r : fallback;
}

/* Whole number text from an input: "12" -> 12, anything else -> null. */
function parseWhole(text, min, max) {
  var s = String(text === null || text === undefined ? "" : text).trim();
  if (!/^\d+$/.test(s)) return null;
  var n = parseInt(s, 10);
  return n >= min && n <= max ? n : null;
}

function emptyConfig() {
  return {
    version: 1,
    defaults: { adults: 2, nights: 2, must_include: ["sat"], top: 3, codes: [] },
    digest: { weekday: "mon" },
    searches: [],
    tracked: []
  };
}

/* Keeps what the page understands from a config file, and any other keys so a save does not drop them. */
function readConfig(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  var base = emptyConfig();
  var out = Object.assign({}, raw);
  out.defaults = Object.assign({}, base.defaults, raw.defaults && typeof raw.defaults === "object" ? raw.defaults : {});
  out.digest = Object.assign({}, base.digest, raw.digest && typeof raw.digest === "object" ? raw.digest : {});
  out.searches = (Array.isArray(raw.searches) ? raw.searches : []).filter(function (s) {
    return !!s && typeof s === "object" && typeof s.id === "string";
  });
  out.tracked = (Array.isArray(raw.tracked) ? raw.tracked : []).filter(function (t) {
    return !!t && typeof t === "object" && typeof t.id === "string";
  });
  return out;
}

/* Tracked id per the contract: {check_in}_{check_out}_a{adults}, plus _c{codes joined by -} when there are codes. */
function trackedId(checkIn, checkOut, adults, codes) {
  var id = checkIn + "_" + checkOut + "_a" + adults;
  if (Array.isArray(codes) && codes.length) id += "_c" + codes.join("-");
  return id;
}

function isTrackedStay(config, search, stay) {
  var id = trackedId(stay.check_in, stay.check_out, search.adults, search.codes);
  return findById(config.tracked, id) !== null;
}

function trackedEntry(search, stay, today) {
  var codes = Array.isArray(search.codes) ? search.codes.slice() : [];
  return {
    id: trackedId(stay.check_in, stay.check_out, search.adults, codes),
    check_in: stay.check_in,
    check_out: stay.check_out,
    adults: search.adults,
    codes: codes,
    notify: "any",
    below: null,
    added: today
  };
}

function newSearchId(nowMs) {
  return "s-" + Math.floor(nowMs).toString(36);
}

/* A new search from config.defaults, dated from today for ADD_DAYS. */
function defaultSearch(config, id, today) {
  var d = config.defaults || {};
  return {
    id: id,
    name: null,
    from: today,
    to: addDays(today, ADD_DAYS),
    nights: clampInt(d.nights, 1, 14, 2),
    must_include: orderDays(d.must_include),
    adults: clampInt(d.adults, 1, 6, 2),
    top: d.top === undefined ? 3 : d.top,
    codes: Array.isArray(d.codes) ? d.codes.slice() : [],
    offers: [],
    rooms: [],
    alerts: []
  };
}

function insertSearch(config, search) {
  var next = clone(config);
  if (!findById(next.searches, search.id)) next.searches.push(search);
  return next;
}

function replaceSearch(config, search) {
  var next = clone(config);
  next.searches = next.searches.map(function (s) { return s && s.id === search.id ? search : s; });
  return next;
}

function removeSearch(config, id) {
  var next = clone(config);
  next.searches = next.searches.filter(function (s) { return s && s.id !== id; });
  return next;
}

function insertTracked(config, entry) {
  var next = clone(config);
  if (!findById(next.tracked, entry.id)) next.tracked.push(entry);
  return next;
}

function removeTracked(config, id) {
  var next = clone(config);
  next.tracked = next.tracked.filter(function (t) { return t && t.id !== id; });
  return next;
}

function patchTracked(config, id, patch) {
  var next = clone(config);
  next.tracked = next.tracked.map(function (t) {
    return t && t.id === id ? Object.assign({}, t, patch) : t;
  });
  return next;
}

function setTrackedNotify(config, id, mode) {
  return patchTracked(config, id, { notify: mode });
}

/* pln is a whole złoty amount or null (no alert). */
function setTrackedBelow(config, id, pln) {
  return patchTracked(config, id, { below: pln });
}

function kindHasValue(kind) {
  return kind === "below" || kind === "per_night_below" || kind === "drop_pct";
}

function alertToDraft(alert) {
  if (!alert || ALERT_KINDS.indexOf(alert.kind) < 0) return null;
  if (alert.kind === "below" || alert.kind === "per_night_below") {
    return { kind: alert.kind, value: isNumber(alert.amount) ? String(alert.amount) : "" };
  }
  if (alert.kind === "drop_pct") {
    return { kind: alert.kind, value: isNumber(alert.pct) ? String(alert.pct) : "" };
  }
  return { kind: alert.kind, value: "" };
}

function draftToAlert(row) {
  if (row.kind === "below" || row.kind === "per_night_below") {
    return { kind: row.kind, amount: parseWhole(row.value, 1, MAX_PLN) };
  }
  if (row.kind === "drop_pct") return { kind: row.kind, pct: parseWhole(row.value, 1, 100) };
  if (row.kind === "below_recent_lowest" || row.kind === "discounted") return { kind: row.kind };
  return null;
}

/* The editor's working copy of a search. Text fields stay as typed until a save. */
function draftFromSearch(search, defaults) {
  var s = search || {};
  var df = defaults || {};
  var topRaw = hasOwn(s, "top") ? s.top : df.top;
  return {
    name: typeof s.name === "string" ? s.name : "",
    from: typeof s.from === "string" ? s.from : "",
    to: typeof s.to === "string" ? s.to : "",
    nights: clampInt(hasOwn(s, "nights") ? s.nights : df.nights, 1, 14, 2),
    adults: clampInt(hasOwn(s, "adults") ? s.adults : df.adults, 1, 6, 2),
    mustInclude: orderDays(hasOwn(s, "must_include") ? s.must_include : df.must_include),
    topAll: topRaw === null || topRaw === undefined,
    top: String(isNumber(topRaw) ? topRaw : 3),
    alerts: (Array.isArray(s.alerts) ? s.alerts : []).map(alertToDraft).filter(function (row) { return row !== null; })
  };
}

/* Inline checks for a draft. Returns messages per field (empty object or nulls when fine). */
function checkDraft(d, today) {
  var errors = {};
  var alerts = [];
  var f = parseIsoDay(d.from);
  var t = parseIsoDay(d.to);
  var now = parseIsoDay(today);
  if (f === null) errors.from = "Pick a date.";
  else if (now !== null && f < now) errors.from = "From can't be in the past.";
  if (t === null) errors.to = "Pick a date.";
  else if (f !== null && t <= f) errors.to = "To must be after from.";
  if (!d.topAll && parseWhole(d.top, 1, MAX_TOP) === null) errors.top = "Enter 1 to " + MAX_TOP + ".";
  d.alerts.forEach(function (row) {
    var msg = null;
    if (row.kind === "below" || row.kind === "per_night_below") {
      if (parseWhole(row.value, 1, MAX_PLN) === null) msg = "Whole złoty above 0.";
    } else if (row.kind === "drop_pct") {
      if (parseWhole(row.value, 1, 100) === null) msg = "Whole percent, 1 to 100.";
    } else if (ALERT_KINDS.indexOf(row.kind) < 0) {
      msg = "Pick a kind.";
    }
    alerts.push(msg);
  });
  var valid = Object.keys(errors).length === 0 && alerts.every(function (m) { return m === null; });
  return { errors: errors, alerts: alerts, valid: valid };
}

/* The config search that a valid draft becomes. base is the fresh search, so keys the page does not edit survive. */
function searchFromDraft(d, id, base) {
  var out = Object.assign({}, base || {});
  var name = String(d.name || "").trim();
  out.id = id;
  out.name = name ? name : null;
  out.from = d.from;
  out.to = d.to;
  out.nights = d.nights;
  out.adults = d.adults;
  out.must_include = orderDays(d.mustInclude);
  out.top = d.topAll ? null : parseWhole(d.top, 1, MAX_TOP);
  out.codes = Array.isArray(out.codes) ? out.codes : [];
  out.offers = Array.isArray(out.offers) ? out.offers : [];
  out.rooms = Array.isArray(out.rooms) ? out.rooms : [];
  out.alerts = d.alerts.map(draftToAlert).filter(function (a) { return a !== null; });
  return out;
}

/* Change since tracked: price now minus first_price. Null when either side is missing. */
function trackedChange(trip) {
  if (!trip || !isNumber(trip.price) || !isNumber(trip.first_price) || trip.first_price <= 0) return null;
  var change = trip.price - trip.first_price;
  var pct = change / trip.first_price * 100;
  return { change: change, pct: pct, tone: changeTone(change, pct) };
}

/* Lower is good: a fall is green; a rise is red only when it is at least 1%, so a tiny move reads neutral. */
function changeTone(change, pct) {
  if (change < 0) return "good";
  if (change > 0 && Math.abs(pct) >= 1) return "bad";
  return "none";
}

/* Attention flags for a tracked trip: the stay flags plus under-alert from the trip's own threshold. */
function tripFlags(trip) {
  var flags = stayFlags(trip);
  if (isPriced(trip) && isNumber(trip.below) && trip.price < trip.below) {
    flags.unshift({ kind: "under", label: "Under alert", tip: "Under your alert of " + formatPln(trip.below) });
  }
  return flags;
}

/* Poll decision for a save: done when latest.json has a new scanned_at, gave-up after six minutes, else waiting. */
function pollDecision(sinceMs, nowMs, baseline, scannedAt) {
  if (scannedAt && scannedAt !== baseline) return "done";
  if (nowMs - sinceMs >= GIVE_UP_MS) return "gave-up";
  return "waiting";
}

/* owner/repo from a GitHub Pages address: https://owner.github.io/repo/ gives owner/repo. */
function repoFromLocation(hostname, pathname) {
  var m = /^([A-Za-z0-9-]+)\.github\.io$/i.exec(hostname || "");
  if (!m) return "";
  var first = String(pathname || "/").split("/").filter(Boolean)[0];
  var candidate = m[1] + "/" + (first ? first : m[1] + ".github.io");
  return isValidRepo(candidate) ? candidate : "";
}

function isValidRepo(value) {
  return typeof value === "string" && value.length <= 201 && REPO_PATTERN.test(value);
}

function isFineGrainedToken(value) {
  return typeof value === "string" && TOKEN_PATTERN.test(value);
}

/* Shown as connected: github_pat_…abcd */
function maskToken(value) {
  return isFineGrainedToken(value) ? "github_pat_…" + value.slice(-4) : "";
}

function ghErrorText(status) {
  if (status === 401) return "GitHub rejected the token (401).";
  if (status === 403) return "This token can't write to the repository (403). It needs Contents: Read and write.";
  if (status === 404) return "GitHub couldn't find config.json or the repository (404). Check the repository name.";
  if (status === 409 || status === 422) return "GitHub refused the change (" + status + "). Try again.";
  if (status === 429) return "GitHub is rate-limiting requests (429). Try again later.";
  return "GitHub returned " + status + ".";
}

function utf8ToBase64(text) {
  var bytes = new TextEncoder().encode(text);
  var bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function base64ToUtf8(b64) {
  var bin = atob(String(b64).replace(/\s+/g, ""));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

/* config.json as the contract writes it: 2-space indent, trailing newline. */
function encodeConfig(config) {
  return JSON.stringify(config, null, 2) + "\n";
}
</script>

<script>
(function () {

  var observers = [];

  function $(id) { return document.getElementById(id); }

  function scanYear() {

  function el(tag, attrs, kids) {

  function svgEl(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);

  function findByAttr(attr, value) {

    }

  }

  /* Storage: every access wrapped; a blocked store reads as empty. */
  function storeGet(key) {
    try {

      return "";
    }
  }

  function storeSet(key, value) {
    try {
      if (value) window.localStorage.setItem(key, value);
      else window.localStorage.removeItem(key);
    } catch (e) {
      /* Storage blocked: the value still works for this page view. */
    }
  }

  function isConnected() {
    return !!state.token;
  }

  /* Edit controls: when GitHub is not connected, the click opens the settings popover instead. */
  function requireConnected() {
    if (isConnected()) return true;
    openPop(CONNECT_HINT);

  function guard(fn) {

      if (event && event.stopPropagation) event.stopPropagation();
      if (!requireConnected()) return;

    };
  }

  /* Tooltip */
  var tipEl = $("tip");
  var tipMain = $("tipMain");
  var tipSub = $("tipSub");

  function showTip(rect, main, sub) {
    tipMain.textContent = main || "";
    tipSub.textContent = sub || "";
    tipEl.hidden = false;
    var w = tipEl.offsetWidth;
    var h = tipEl.offsetHeight;
    var cx = (rect.left + rect.right) / 2;
    var top = rect.top - h - 8;
    if (top < 8) top = rect.bottom + 8;
    var left = Math.min(Math.max(8, cx - w / 2), window.innerWidth - w - 8);

    tipEl.style.top = top + "px";

  function hideTip() {

  }

  function tipTarget(node) {
    return node && node.closest ? node.closest("[data-tip]") : null;
  }

  document.addEventListener("pointerover", function (event) {
    if (event.pointerType && event.pointerType !== "mouse") return;
    var target = tipTarget(event.target);

  });
  document.addEventListener("pointerout", function (event) {
    var target = tipTarget(event.target);
    if (target && !target.contains(event.relatedTarget)) hideTip();
  });
  document.addEventListener("pointerdown", function (event) {
    var target = tipTarget(event.target);
    if (target && event.pointerType === "touch") showTip(target.getBoundingClientRect(), target.getAttribute("data-tip"), "");

  /* Pill */
  function updatePill() {

  /* Settings popover: booking slug and GitHub connection */
  var gear = $("gear");
  var pop = $("pop");
  var popHint = $("popHint");
  var slugInput = $("slug");
  var slugClear = $("slugClear");
  var repoInput = $("repo");
  var tokenInput = $("token");
  var tokenOn = $("tokenOn");
  var tokenOff = $("tokenOff");
  var tokenMask = $("tokenMask");
  var ghTest = $("ghTest");
  var ghSave = $("ghSave");
  var ghDisconnect = $("ghDisconnect");
  var ghStatusEl = $("ghStatus");

  function setGhStatus(text, isError) {
    state.ghStatus = text || "";
    state.ghStatusError = !!isError;
    ghStatusEl.hidden = !state.ghStatus;
    ghStatusEl.textContent = state.ghStatus;
    ghStatusEl.className = "form-status" + (isError ? " error" : "");
  }

  function refreshGhFields() {
    var on = isConnected();
    tokenOn.hidden = !on;
    tokenOff.hidden = on;
    tokenMask.textContent = maskToken(state.token);

  }

  function openPop(hint) {
    pop.hidden = false;
    gear.setAttribute("aria-expanded", "true");
    state.popHint = hint || "";
    popHint.hidden = !state.popHint;
    popHint.textContent = state.popHint;
    slugInput.value = state.slug;
    slugInput.removeAttribute("aria-invalid");
    slugClear.hidden = !state.slug;
    repoInput.value = state.repo;
    repoInput.removeAttribute("aria-invalid");
    tokenInput.value = "";
    tokenInput.removeAttribute("aria-invalid");
    refreshGhFields();
    setGhStatus("", false);
    if (hint && !isConnected()) tokenInput.focus();
    else slugInput.focus();
  }

  function closePop(returnFocus) {
    pop.hidden = true;
    gear.setAttribute("aria-expanded", "false");
    if (returnFocus) gear.focus();
  }

  function saveSlug(value) {
    state.slug = value;
    if (value) storeSet(SLUG_KEY, value);
    else storeSet(SLUG_KEY, "");
  }

  function readSlug() {
    var value = storeGet(SLUG_KEY);
    return isValidSlug(value) ? value : "";
  }

  function saveFromPop() {
    var value = slugInput.value.trim();
    if (!isValidSlug(value)) {
      slugInput.setAttribute("aria-invalid", "true");
      slugInput.focus();
      return;
    }
    saveSlug(value);
    closePop(true);
    renderApp();
  }

  function clearFromPop() {
    saveSlug("");
    closePop(true);
    renderApp();
  }

  function ghFileUrl(repo) {
    return "https://api.github.com/repos/" + repo + "/contents/docs/config.json";
  }

  function ghHeaders(token, json) {
    var headers = {
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      Authorization: "Bearer " + token
    };
    if (json) headers["Content-Type"] = "application/json";
    return headers;
  }

  gear.addEventListener("click", function (event) {
    event.stopPropagation();
    if (pop.hidden) openPop("");
    else closePop(false);
  });
  $("slugSave").addEventListener("click", saveFromPop);
  slugClear.addEventListener("click", clearFromPop);
  slugInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      saveFromPop();
    }
  });

  ghSave.addEventListener("click", function () {
    var repo = repoInput.value.trim();
    if (!isValidRepo(repo)) {
      repoInput.setAttribute("aria-invalid", "true");
      repoInput.focus();
      setGhStatus("Use owner/repo.", true);
      return;
    }
    repoInput.removeAttribute("aria-invalid");
    if (!isConnected()) {
      var typed = tokenInput.value.trim();
      if (!isFineGrainedToken(typed)) {
        tokenInput.setAttribute("aria-invalid", "true");
        tokenInput.focus();
        setGhStatus("Use a fine-grained token that starts with github_pat_.", true);
        return;
      }
      state.token = typed;
      storeSet(TOKEN_KEY, typed);
      tokenInput.value = "";
    }
    state.repo = repo;
    storeSet(REPO_KEY, repo);
    refreshGhFields();
    setGhStatus("Saved.", false);
    renderApp();
  });

  $("ghForm").addEventListener("submit", function (event) {
    event.preventDefault();
  });

  ghTest.addEventListener("click", async function () {
    var repo = repoInput.value.trim();
    if (!isValidRepo(repo)) {
      repoInput.setAttribute("aria-invalid", "true");
      setGhStatus("Use owner/repo.", true);
      return;
    }
    var token = isConnected() ? state.token : tokenInput.value.trim();
    if (!isFineGrainedToken(token)) {
      setGhStatus("Add a fine-grained token first.", true);
      return;
    }
    if (sampleName) {
      setGhStatus("Sample mode: no request sent.", false);
      return;
    }
    setGhStatus("Testing…", false);
    try {
      var res = await fetch(ghFileUrl(repo), { headers: ghHeaders(token, false), cache: "no-store" });
      if (res.ok) setGhStatus("Connected. config.json is readable.", false);
      else setGhStatus(ghErrorText(res.status), true);
    } catch (e) {
      setGhStatus("Couldn't reach GitHub.", true);
    }
  });

  ghDisconnect.addEventListener("click", function () {
    state.token = "";
    storeSet(TOKEN_KEY, "");
    state.editing = null;
    state.draft = null;
    state.confirmDelete = null;
    refreshGhFields();
    setGhStatus("Disconnected.", false);
    renderApp();
  });

  document.addEventListener("pointerdown", function (event) {
    if (pop.hidden) return;
    if (pop.contains(event.target) || gear.contains(event.target)) return;
    closePop(false);
  }, true);
  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    hideTip();
    if (!pop.hidden) closePop(true);
  });

  /* Charts and observers */
  function disconnectObservers() {
    observers.forEach(function (observer) { observer.disconnect(); });
    observers = [];
  }

  function attachChart(box, draw, owner) {
    var lastWidth = -1;
    function run() {
      var width = Math.round(box.clientWidth);
      if (width > 0 && width !== lastWidth) {
        lastWidth = width;
        draw(Math.max(width, 260));
      }
